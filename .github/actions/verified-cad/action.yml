name: Verify manufacturing package
description: Reuse verified main or source-identical same-PR acceptance before installing CAD
inputs:
  force:
    description: Bypass all saved generation and verification results
    default: 'false'
runs:
  using: composite
  steps:
    - name: Fingerprint manufacturing inputs without CAD
      id: cad-key
      shell: bash
      run: python3 scripts/ci/cad_result.py key
    - name: Resolve immutable trusted CAD result
      id: trusted
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CAD_KEY: ${{ steps.cad-key.outputs.key }}
        CAD_FORCE: ${{ inputs.force }}
      with:
        script: |
          await require('./scripts/ci/cad-result.cjs').resolve({ github, context, core }, {
            key: process.env.CAD_KEY, force: process.env.CAD_FORCE === 'true',
          });
    - name: Restore immutable outputs and acceptance
      id: download
      if: steps.trusted.outputs.artifact-id != ''
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.trusted.outputs.artifact-id }}
        merge-multiple: true
        run-id: ${{ steps.trusted.outputs.run-id }}
        github-token: ${{ github.token }}
        path: kufr/mechanika/final/exports
    - name: Validate trusted bytes and refresh presentation without CAD
      id: accepted
      if: steps.download.outcome == 'success'
      shell: bash
      run: python3 scripts/ci/cad_result.py restore
    - name: Authenticate merged PR verification as a main result
      if: steps.accepted.outputs.hit == 'true' && steps.trusted.outputs.scope == 'merged-pr'
      shell: bash
      env:
        CAD_SOURCE_RUN: ${{ steps.trusted.outputs.run-id }}
        CAD_SOURCE_ARTIFACT: ${{ steps.trusted.outputs.artifact-id }}
        CAD_SOURCE_PR: ${{ steps.trusted.outputs.source-pr }}
        CAD_SOURCE_MERGE: ${{ steps.trusted.outputs.source-merge-sha }}
        CAD_SOURCE_BUILT: ${{ steps.trusted.outputs.source-built-sha }}
        CAD_SOURCE_BASIS: ${{ steps.trusted.outputs.source-basis }}
        CAD_SOURCE_BASE: ${{ steps.trusted.outputs.source-base-sha }}
        CAD_SOURCE_AUTH_MAIN: ${{ steps.trusted.outputs.source-main-sha }}
        CAD_MAIN_SHA: ${{ github.sha }}
      run: python3 scripts/ci/cad_result.py promote
    - name: Discard missing or invalid restored output staging
      if: steps.accepted.outputs.hit != 'true' && steps.accepted.outputs.artifact-valid != 'true'
      shell: bash
      run: python3 scripts/ci/cad_result.py discard
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      if: steps.accepted.outputs.hit != 'true'
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: kufr/mechanika/final/requirements.txt
    - name: Install pinned CAD dependencies
      if: steps.accepted.outputs.hit != 'true'
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/cad-venv"
        "$RUNNER_TEMP/cad-venv/bin/python" -m pip install -r kufr/mechanika/final/requirements.txt
        echo "$RUNNER_TEMP/cad-venv/bin" >> "$GITHUB_PATH"
    - name: Install official pinned PrusaSlicer CLI
      if: steps.accepted.outputs.hit != 'true'
      shell: bash
      run: xvfb-run -a bash scripts/ci/install-cad-slicer.sh
    - name: Generate missing exports and verify manufacturing package
      if: steps.accepted.outputs.hit != 'true'
      shell: bash
      env:
        CAD_FORCE: ${{ inputs.force }}
      run: |
        force=()
        if [[ "$CAD_FORCE" == true ]]; then force+=(--force); fi
        xvfb-run -a python scripts/ci/cad_cache.py "${force[@]}"
        xvfb-run -a python scripts/ci/cad_result.py publish
    - name: Retain verified results only from canonical main
      if: (steps.accepted.outputs.hit != 'true' || steps.trusted.outputs.scope == 'merged-pr') && github.repository == 'Blato58/DildoVander' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !github.event.inputs.pr_number))
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cad-result-v1-${{ steps.cad-key.outputs.key }}
        path: kufr/mechanika/final/exports
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    - name: Retain verified results within this PR
      if: steps.accepted.outputs.hit != 'true' && github.repository == 'Blato58/DildoVander' && github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cad-pr-result-v1-${{ steps.cad-key.outputs.key }}
        path: kufr/mechanika/final/exports
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    - name: Summarize CAD execution
      if: always()
      shell: bash
      env:
        CAD_HIT: ${{ steps.accepted.outputs.hit }}
        CAD_FORCE: ${{ inputs.force }}
        CAD_JOB_STATUS: ${{ job.status }}
        CAD_ARTIFACT_ID: ${{ steps.trusted.outputs.artifact-id }}
        CAD_SOURCE_SCOPE: ${{ steps.trusted.outputs.scope }}
        CAD_SOURCE_RUN: ${{ steps.trusted.outputs.run-id }}
        CAD_SOURCE_PR: ${{ steps.trusted.outputs.source-pr }}
        CAD_SOURCE_BASIS: ${{ steps.trusted.outputs.source-basis }}
      run: |
        {
          echo '### CAD manufacturing'
          echo "- Trusted CAD artifact: ${CAD_ARTIFACT_ID:-none}"
          echo "- Verification source: ${CAD_SOURCE_SCOPE:-fresh}; original run: ${CAD_SOURCE_RUN:-current}"
          echo "- Source proof: ${CAD_SOURCE_BASIS:-canonical-main-or-fresh}"
          echo "- Verified result reused: ${CAD_HIT:-false}; force: $CAD_FORCE"
          if [[ "$CAD_HIT" == true && "$CAD_SOURCE_SCOPE" == merged-pr ]]; then
            echo "- Promoted verified PR #$CAD_SOURCE_PR result to main after server merge and source-tree authentication; original CAD verification retained."
          fi
          if [[ "$CAD_HIT" == true ]]; then
            echo '- CAD setup, generation, renders and mechanical re-verification skipped: identical manufacturing inputs and verified bytes.'
          else
            echo '- CAD generation/verification path selected; eligible individual exports reused unless forced.'
          fi
          echo "- Job outcome: $CAD_JOB_STATUS"
        } >> "$GITHUB_STEP_SUMMARY"
