name: Kufr backend interactive dialogue

on:
  workflow_dispatch:
    inputs:
      action:
        description: start, reply, finish, status or clear
        required: true
        type: choice
        options: [start, reply, finish, status, clear]
      request_id:
        description: UUID that makes this exact invocation idempotent
        required: true
        type: string
      state:
        description: Opaque JSON state returned by start or reply
        required: false
        type: string
      text:
        description: Synthetic visitor text; required only for reply
        required: false
        type: string
      expected_evening_id:
        description: Explicit evening UUID to clear; required only for clear
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kufr-backend-production
  cancel-in-progress: false

jobs:
  dialogue:
    if: github.repository == 'Blato58/DildoVander' && github.event.repository.private == true && (github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, kufr-backend]
    timeout-minutes: 2
    environment: backend-production
    env:
      DEV_DEVICE_CREDENTIAL: ${{ secrets.DEV_DEVICE_CREDENTIAL }}
      DEVICE_ID: ${{ secrets.DEVICE_ID }}
      KUFR_BACKEND_PUBLIC_IPV4: ${{ vars.KUFR_BACKEND_PUBLIC_IPV4 }}
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      INPUT_STATE: ${{ inputs.state }}
      INPUT_TEXT: ${{ inputs.text }}
      INPUT_EXPECTED_EVENING_ID: ${{ inputs.expected_evening_id }}
    outputs:
      report_path: ${{ steps.dialogue.outputs.report_path }}
      report_json: ${{ steps.dialogue.outputs.report_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: dialogue
        name: Run one interactive action
        run: python3 kufr/backend/tests/interactive_dialogue.py
      - name: Upload interactive dialogue report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interactive-dialogue
          path: ${{ runner.temp }}/interactive-dialogue.json
          if-no-files-found: error
          retention-days: 7
