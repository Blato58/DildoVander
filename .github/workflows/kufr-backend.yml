name: Build Kufr backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: kufr/global.json
          cache: true
          cache-dependency-path: |
            kufr/backend/packages.lock.json
            kufr/backend-tests/packages.lock.json
      - name: Restore test and self-contained runtime dependencies
        run: dotnet restore kufr/backend-tests/BackendTests.csproj -r linux-x64 -p:SelfContained=true --locked-mode
      - name: Build backend and tests once in Release
        run: dotnet build kufr/backend-tests/BackendTests.csproj -c Release -r linux-x64 -p:SelfContained=true --no-restore
      - name: Backend tests
        run: dotnet run --project kufr/backend-tests/BackendTests.csproj -c Release -r linux-x64 --no-build --no-restore
      - name: Publish self-contained Ubuntu binary
        run: dotnet publish kufr/backend/backend.csproj -c Release -r linux-x64 --self-contained true --no-build --no-restore -o "$RUNNER_TEMP/kufr-publish"
      - name: HTTP smoke tests
        env:
          KUFR_BACKEND_DLL: ${{ runner.temp }}/kufr-publish/backend.dll
        run: node kufr/backend/tests/smoke.mjs
      - name: Interactive client offline tests
        run: python3 -m unittest discover -s kufr/backend/tests -p 'test_*.py'
      - name: Deployment configuration tests
        run: python3 -m unittest discover -s kufr/backend/deploy -p 'test_*.py'
      - name: Package backend with build provenance
        run: python3 scripts/ci/package.py pack "$RUNNER_TEMP/kufr-publish" "$RUNNER_TEMP/backend-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-publish
          path: ${{ runner.temp }}/backend-package/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
