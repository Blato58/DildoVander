name: Build Kufr firmware

on:
  workflow_call:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: kufr/contracts/.nvmrc
          cache: npm
          cache-dependency-path: kufr/contracts/package-lock.json
      - name: Install contract verifier
        working-directory: kufr/contracts
        run: npm ci
      - name: Correlated speech audio buffer
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/SpeechAudioBuffer.cpp \
            src/features/conversation/SpeechOperationCodec.cpp \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            tests/speech_audio_buffer_test.cpp -o "$RUNNER_TEMP/speech-audio-test"
          "$RUNNER_TEMP/speech-audio-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread -I tests/speech_stubs \
            src/features/conversation/EspIdfSpeechTransport.cpp \
            src/features/conversation/SpeechAudioBuffer.cpp \
            src/features/conversation/SpeechOperationCodec.cpp \
            src/features/conversation/OperationAcceptedCodec.cpp \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/backend_access/NetworkSettings.cpp \
            tests/espidf_speech_transport_test.cpp -o "$RUNNER_TEMP/speech-transport-test"
          "$RUNNER_TEMP/speech-transport-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/SpeechOutputCoordinator.cpp \
            src/features/conversation/SpeechAudioBuffer.cpp \
            src/features/conversation/SpeechOperationCodec.cpp \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/TurnPollSchedule.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            tests/speech_output_coordinator_test.cpp -o "$RUNNER_TEMP/speech-output-test"
          "$RUNNER_TEMP/speech-output-test"
      - name: Device control tests
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            src/features/safety/SafetyController.cpp
            src/features/wand_selection/SelectionSequence.cpp
            src/features/device_control/DeviceControl.cpp
          )
          g++ -std=c++14 -Wall -Wextra -Werror \
            "${sources[@]}" tests/device_control_test.cpp \
            -o "$RUNNER_TEMP/device-control-test"
          "$RUNNER_TEMP/device-control-test"
          g++ -std=c++14 -Wall -Wextra -Werror \
            "${sources[@]}" \
            src/features/device_control/DeviceControlRuntime.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/device_control_runtime_test.cpp \
            -o "$RUNNER_TEMP/device-control-runtime-test"
          "$RUNNER_TEMP/device-control-runtime-test"
      - name: Shared STA network lifecycle
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/station_stubs \
            src/features/backend_access/EspIdfStationNetwork.cpp \
            src/features/backend_access/NetworkSettings.cpp \
            src/features/backend_access/ReconnectPolicy.cpp \
            tests/espidf_station_network_test.cpp \
            -o "$RUNNER_TEMP/station-network-test"
          "$RUNNER_TEMP/station-network-test"
      - name: Local service discovery lifecycle
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/wifi_stubs -I tests/station_stubs \
            src/features/backend_access/EspIdfWifiStation.cpp \
            src/features/backend_access/NetworkSettings.cpp \
            tests/espidf_wifi_station_test.cpp -o "$RUNNER_TEMP/wifi-station-test"
          "$RUNNER_TEMP/wifi-station-test"
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/discovery_stubs -I tests/station_stubs \
            src/features/local_control/EspIdfLocalServiceAdvertisement.cpp \
            src/features/backend_access/NetworkSettings.cpp \
            tests/espidf_local_service_advertisement_test.cpp -o "$RUNNER_TEMP/local-discovery-test"
          "$RUNNER_TEMP/local-discovery-test"
      - name: Local control codec test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/local_control/LocalControlCodec.cpp \
            tests/local_control_codec_test.cpp \
            -o "$RUNNER_TEMP/local-control-codec-test"
          "$RUNNER_TEMP/local-control-codec-test" \
            ../contracts/fixtures/valid/{hello,state-get,control-acquire,control-release,heartbeat,safety-stop,safety-reset,conversation-text,conversation-cancel,selection-start,inventory-confirm-reload}.json \
            --reject ../contracts/fixtures/invalid/*.json
      - name: Local control inbox test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/local_control/LocalControlInbox.cpp \
            tests/local_control_inbox_test.cpp \
            -o "$RUNNER_TEMP/local-control-inbox-test"
          "$RUNNER_TEMP/local-control-inbox-test"
      - name: Local WSS server adapter test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread -I tests/server_stubs \
            src/features/local_control/EspIdfLocalControlServer.cpp \
            src/features/local_control/LocalControlCodec.cpp \
            src/features/local_control/LocalControlInbox.cpp \
            src/features/local_control/LocalSocketAdmission.cpp \
            src/features/local_control/LocalBearerAuthenticator.cpp \
            src/features/provisioning/LocalTlsIdentity.cpp \
            src/features/provisioning/LocalPairingCredential.cpp \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            tests/local_control_server_test.cpp \
            -o "$RUNNER_TEMP/local-control-server-test"
          "$RUNNER_TEMP/local-control-server-test" \
            ../contracts/fixtures/valid/hello.json \
            ../contracts/fixtures/valid/safety-stop.json
      - name: Local control output interop test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/safety/SafetyController.cpp \
            src/features/wand_selection/SelectionSequence.cpp \
            src/features/device_control/DeviceControl.cpp \
            src/features/device_control/PersistentCommandJournal.cpp \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/local_control/LocalControlOutput.cpp \
            tests/local_control_output_test.cpp \
            -o "$RUNNER_TEMP/local-control-output-test"
          "$RUNNER_TEMP/local-control-output-test" > "$RUNNER_TEMP/control-output.jsonl"
          node ../contracts/verify-firmware-output.mjs "$RUNNER_TEMP/control-output.jsonl"
      - name: Local control owner test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/safety/SafetyController.cpp \
            src/features/wand_selection/SelectionSequence.cpp \
            src/features/device_control/DeviceControl.cpp \
            src/features/device_control/DeviceControlRuntime.cpp \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            src/features/local_control/LocalControlSession.cpp \
            src/features/local_control/LocalConversationGateway.cpp \
            src/features/local_control/LocalControlInbox.cpp \
            src/features/local_control/LocalControlOwner.cpp \
            tests/local_control_owner_test.cpp \
            -o "$RUNNER_TEMP/local-control-owner-test"
          "$RUNNER_TEMP/local-control-owner-test"
      - name: Local control session test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror \
            src/features/safety/SafetyController.cpp \
            src/features/wand_selection/SelectionSequence.cpp \
            src/features/device_control/DeviceControl.cpp \
            src/features/device_control/DeviceControlRuntime.cpp \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationTurnFailureInbox.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            src/features/local_control/LocalControlSession.cpp \
            src/features/local_control/LocalConversationGateway.cpp \
            tests/local_control_session_test.cpp \
            -o "$RUNNER_TEMP/local-control-session-test"
          "$RUNNER_TEMP/local-control-session-test"
      - name: Local pairing credential test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror \
            src/features/provisioning/LocalPairingCredential.cpp \
            tests/local_pairing_credential_test.cpp \
            -o "$RUNNER_TEMP/local-pairing-credential-test"
          "$RUNNER_TEMP/local-pairing-credential-test"
      - name: Radio-gated pairing random adapter test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -Itests/idf_stubs \
            src/features/provisioning/EspIdfPairingRandom.cpp \
            tests/espidf_pairing_random_test.cpp \
            -o "$RUNNER_TEMP/espidf-pairing-random-test"
          "$RUNNER_TEMP/espidf-pairing-random-test"
      - name: Local TLS identity test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror \
            src/features/provisioning/LocalTlsIdentity.cpp \
            tests/local_tls_identity_test.cpp \
            -o "$RUNNER_TEMP/local-tls-identity-test"
          "$RUNNER_TEMP/local-tls-identity-test"
      - name: Local bearer authorization test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror \
            src/features/provisioning/LocalPairingCredential.cpp \
            src/features/local_control/LocalBearerAuthenticator.cpp \
            tests/local_bearer_authenticator_test.cpp \
            -o "$RUNNER_TEMP/local-bearer-authorization-test"
          "$RUNNER_TEMP/local-bearer-authorization-test"
      - name: Local socket admission test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/provisioning/LocalPairingCredential.cpp \
            src/features/local_control/LocalBearerAuthenticator.cpp \
            src/features/local_control/LocalSocketAdmission.cpp \
            tests/local_socket_admission_test.cpp \
            -o "$RUNNER_TEMP/local-socket-admission-test"
          "$RUNNER_TEMP/local-socket-admission-test"
      - name: Snapshot-bound text inbox test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationTextInbox.cpp \
            tests/conversation_text_inbox_test.cpp \
            -o "$RUNNER_TEMP/conversation-text-inbox-test"
          "$RUNNER_TEMP/conversation-text-inbox-test"
      - name: Snapshot-bound reply inbox test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationReplyInbox.cpp \
            tests/conversation_reply_inbox_test.cpp \
            -o "$RUNNER_TEMP/conversation-reply-inbox-test"
          "$RUNNER_TEMP/conversation-reply-inbox-test"
      - name: Local turn to backend reply correlation test
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationTextInbox.cpp \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/ConversationReplyInbox.cpp \
            tests/conversation_turn_correlation_test.cpp \
            -o "$RUNNER_TEMP/conversation-turn-correlation-test"
          "$RUNNER_TEMP/conversation-turn-correlation-test"
      - name: Conversation proposal and opening tests
        working-directory: kufr/firmware
        shell: bash
        run: |
          set -euo pipefail
          conversation=(
            src/features/conversation/ConversationSession.cpp
            src/features/conversation/ConversationStartCodec.cpp
          )
          g++ -std=c++14 -Wall -Wextra -Werror \
            "${conversation[@]}" \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/TurnOperationCodec.cpp \
            tests/turn_operation_codec_test.cpp \
            -o "$RUNNER_TEMP/turn-operation-codec-test"
          "$RUNNER_TEMP/turn-operation-codec-test"
          g++ -std=c++14 -Wall -Wextra -Werror \
            "${conversation[@]}" \
            src/features/conversation/ConversationTextCodec.cpp \
            tests/conversation_text_codec_test.cpp \
            -o "$RUNNER_TEMP/conversation-text-codec-test"
          "$RUNNER_TEMP/conversation-text-codec-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            tests/pending_proposal_test.cpp \
            -o "$RUNNER_TEMP/pending-proposal-test"
          "$RUNNER_TEMP/pending-proposal-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/wand_presentation_test.cpp \
            -o "$RUNNER_TEMP/wand-presentation-test"
          "$RUNNER_TEMP/wand-presentation-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/safety/SafetyController.cpp \
            src/features/wand_selection/SelectionSequence.cpp \
            src/features/device_control/DeviceControl.cpp \
            src/features/device_control/DeviceControlRuntime.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/autonomous_presentation_lifecycle_test.cpp \
            -o "$RUNNER_TEMP/autonomous-presentation-lifecycle-test"
          "$RUNNER_TEMP/autonomous-presentation-lifecycle-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            "${conversation[@]}" \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/TurnOperationCodec.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/turn_replay.cpp \
            -o "$RUNNER_TEMP/turn-replay"

  firmware-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-${{ runner.os }}-6.2.0-${{ hashFiles('kufr/firmware/platformio.ini', 'kufr/firmware/dependencies.lock.md') }}
      - name: Install pinned PlatformIO Core
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/platformio-venv"
          "$RUNNER_TEMP/platformio-venv/bin/python" -m pip install platformio==6.2.0
      - name: Build ESP-IDF profile
        shell: bash
        run: |
          "$RUNNER_TEMP/platformio-venv/bin/pio" run -d kufr/firmware -e esp32-s3-idf -s
      - name: Build Arduino serial profile
        shell: bash
        run: |
          "$RUNNER_TEMP/platformio-venv/bin/pio" run -d kufr/firmware -e esp32-s3-arduino-serial -s
      - name: Bundle flashable firmware outputs without device credentials
        shell: bash
        run: |
          set -euo pipefail
          for profile in esp32-s3-idf esp32-s3-arduino-serial; do
            mkdir -p "$RUNNER_TEMP/firmware/$profile"
            cp kufr/firmware/.pio/build/"$profile"/*.bin "$RUNNER_TEMP/firmware/$profile/"
            cp kufr/firmware/.pio/build/"$profile"/firmware.elf "$RUNNER_TEMP/firmware/$profile/"
          done
          python3 scripts/ci/package.py pack "$RUNNER_TEMP/firmware" "$RUNNER_TEMP/firmware-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware
          path: ${{ runner.temp }}/firmware-package/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
