name: Build Kufr firmware

on:
  workflow_call:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # DV02 compares the original core at its pinned commit.
      - name: Fetch immutable pre-DV02 regression baseline
        # Squash merges leave this original commit outside main's ancestry.
        run: git fetch --no-tags --depth=1 origin 74f215fc371e19780a3521adf0f7b79dcdb068a5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: contracts/.nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install contract verifier
        working-directory: contracts
        run: npm ci
      - name: Test compiler cache pruning
        run: python3 -m unittest discover -s firmware/ci -p 'test_*.py'
      - name: Test servo bench command safety
        run: python3 firmware/diagnostics/servo-bench/tests/run_tests.py
      - name: Test servo bench local panel and serial state
        run: |
          node --test firmware/diagnostics/servo-bench/web/tests/*.test.mjs
          python3 -B -m unittest discover -s firmware/diagnostics/servo-bench/web/tests -p 'test_*.py' -v
      - name: Test automatic firmware versions and OTA packaging
        run: python3 -m unittest discover -s firmware/tools -p 'test_*.py'
      - name: SD dance playback, synchronized effects and cancellation
        working-directory: firmware
        shell: bash
        run: bash tests/run_dance_tests.sh
      - name: DV02 compiler, owner replay and bounded diagnostics
        run: |
          python3 scripts/check_dv02.py
          python3 mechanika/final/generate_effects.py --check
          python3 mechanika/final/test_effects.py
          python3 firmware/tests/run_show_tests.py
          python3 firmware/simulator/native/test_host.py
          python3 firmware/simulator/native/build_host.py --output "$RUNNER_TEMP/native-media-twin"
          python3 firmware/simulator/native/test_media.py --executable "$RUNNER_TEMP/native-media-twin"
          python3 firmware/tests/compare_legacy_show.py
          node --test mechanika/final/test_show_timeline.cjs
      - name: Bodyless backend token exchange
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/speech_stubs -I lib/device_configuration/include \
            src/features/backend_access/EspIdfTokenExchangeTransport.cpp \
            lib/device_configuration/NetworkSettings.cpp \
            src/features/backend_access/TokenResponseParser.cpp \
            tests/espidf_token_exchange_transport_test.cpp -o "$RUNNER_TEMP/token-transport-test"
          "$RUNNER_TEMP/token-transport-test"
      - name: DV10 bounded outcome mailbox and durable delivery acknowledgement
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror tests/keepsake_outbox_test.cpp -o "$RUNNER_TEMP/keepsake-outbox-test"
          "$RUNNER_TEMP/keepsake-outbox-test"
      - name: DV10 real persistence checkpoint codec
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          cjson="$RUNNER_TEMP/dv10-cjson"
          mkdir -p "$cjson"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/DaveGamble/cJSON/v1.7.19/cJSON.c -o "$cjson/cJSON.c"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/DaveGamble/cJSON/v1.7.19/cJSON.h -o "$cjson/cJSON.h"
          echo "298581a04a36c0165da4b0aade235c23088cb2faa58651d720ea2f3706ed0b0d  $cjson/cJSON.c" | sha256sum -c -
          echo "25b0145150d500498e4d209cec69c18c42cf818bffcc54690be3b895a2a16dee  $cjson/cJSON.h" | sha256sum -c -
          python3 tests/run_inventory_tests.py --cjson-dir "$cjson"
      - name: Optional costume photo consent and HTTPS upload
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          common=(src/features/costume_photo/CostumePhoto.cpp
            src/features/conversation/ConversationSession.cpp
            src/features/conversation/ConversationStartCodec.cpp
            src/features/conversation/TurnPollGuard.cpp)
          g++ -std=c++14 -Wall -Wextra -Werror "${common[@]}" \
            src/features/local_control/LocalControlCodec.cpp \
            tests/costume_photo_test.cpp -o "$RUNNER_TEMP/costume-photo-test"
          "$RUNNER_TEMP/costume-photo-test"
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/speech_stubs -I lib/device_configuration/include "${common[@]}" \
            src/features/costume_photo/EspIdfCostumeUpload.cpp \
            src/features/backend_access/DeviceTokenSession.cpp \
            lib/device_configuration/NetworkSettings.cpp \
            lib/device_configuration/DeviceIdentity.cpp \
            tests/espidf_costume_upload_test.cpp -o "$RUNNER_TEMP/costume-upload-test"
          "$RUNNER_TEMP/costume-upload-test"
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/camera_stubs "${common[@]}" \
            src/features/costume_photo/EspIdfCostumeCamera.cpp \
            tests/espidf_costume_camera_test.cpp -o "$RUNNER_TEMP/costume-camera-test"
          "$RUNNER_TEMP/costume-camera-test"
      - name: Host-only legacy speech codec compatibility
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/SpeechAudioBuffer.cpp \
            src/features/conversation/SpeechOperationCodec.cpp \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            tests/speech_audio_buffer_test.cpp -o "$RUNNER_TEMP/speech-audio-test"
          "$RUNNER_TEMP/speech-audio-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/SpeechOutputCoordinator.cpp \
            src/features/conversation/SpeechAudioBuffer.cpp \
            src/features/conversation/SpeechOperationCodec.cpp \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/TurnPollSchedule.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            tests/speech_output_coordinator_test.cpp -o "$RUNNER_TEMP/speech-output-test"
          "$RUNNER_TEMP/speech-output-test"
      - name: Realtime voice codecs and physical PCM adapter
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          common=(
            src/features/voice_turn/RealtimeEventCodec.cpp
            src/features/conversation/TurnOperationCodec.cpp
            src/features/conversation/TurnPollGuard.cpp
            src/features/conversation/ConversationSession.cpp
            src/features/conversation/ConversationStartCodec.cpp
          )
          g++ -std=c++14 -Wall -Wextra -Werror "${common[@]}" \
            src/features/local_control/LocalControlCodec.cpp \
            tests/realtime_voice_test.cpp -o "$RUNNER_TEMP/realtime-voice-test"
          "$RUNNER_TEMP/realtime-voice-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread -I tests/audio_stubs \
            src/features/voice_turn/EspIdfVoiceAudio.cpp tests/espidf_voice_audio_test.cpp \
            -o "$RUNNER_TEMP/voice-audio-test"
          "$RUNNER_TEMP/voice-audio-test"
      - name: Physical effects and calibrated timed presentation
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/physical_effects/PhysicalEffects.cpp \
            src/features/physical_effects/PhysicalPresentation.cpp \
            src/features/safety/SafetyController.cpp \
            src/features/wand_selection/SelectionSequence.cpp \
            src/features/device_control/DeviceControl.cpp \
            src/features/device_control/DeviceControlRuntime.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/physical_effects_test.cpp -o "$RUNNER_TEMP/physical-effects-test"
          "$RUNNER_TEMP/physical-effects-test"
          python3 -m unittest discover -s diagnostics/hardware-service -p 'test_*.py'
      - name: Optional read-only SD assets and adapter
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror \
            src/features/sd_assets/AssetReader.cpp \
            tests/sd_assets_test.cpp -o "$RUNNER_TEMP/sd-assets-test"
          "$RUNNER_TEMP/sd-assets-test"
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/sd_stubs \
            src/features/sd_assets/AssetReader.cpp \
            src/features/sd_assets/EspIdfSdAssets.cpp \
            tests/espidf_sd_assets_test.cpp -o "$RUNNER_TEMP/sd-assets-adapter-test"
          "$RUNNER_TEMP/sd-assets-adapter-test"
      - name: Physical USB network service validation
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s diagnostics/network-service -p 'test_*.py'
      - name: Device control tests
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            src/features/safety/SafetyController.cpp
            src/features/wand_selection/SelectionSequence.cpp
            src/features/device_control/DeviceControl.cpp
          )
          g++ -std=c++14 -Wall -Wextra -Werror \
            "${sources[@]}" tests/device_control_test.cpp \
            -o "$RUNNER_TEMP/device-control-test"
          "$RUNNER_TEMP/device-control-test"
          g++ -std=c++14 -Wall -Wextra -Werror \
            "${sources[@]}" \
            src/features/device_control/DeviceControlRuntime.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/device_control_runtime_test.cpp \
            -o "$RUNNER_TEMP/device-control-runtime-test"
          "$RUNNER_TEMP/device-control-runtime-test"
          g++ -std=c++14 -Wall -Wextra -Werror \
            "${sources[@]}" \
            src/features/device_control/DeviceControlRuntime.cpp \
            src/features/device_control/PersistentCommandJournal.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/keepsake_durability_test.cpp -o "$RUNNER_TEMP/keepsake-durability-test"
          "$RUNNER_TEMP/keepsake-durability-test"
      - name: Shared STA network lifecycle
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/station_stubs -I lib/device_configuration/include \
            src/features/network_provisioning/NetworkProfiles.cpp \
            src/features/backend_access/EspIdfStationNetwork.cpp \
            lib/device_configuration/NetworkSettings.cpp \
            src/features/backend_access/ReconnectPolicy.cpp \
            tests/espidf_station_network_test.cpp \
            -o "$RUNNER_TEMP/station-network-test"
          "$RUNNER_TEMP/station-network-test"
      - name: Secure network profiles and OTA policy/adapters
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -I lib/device_configuration/include src/features/network_provisioning/NetworkProfiles.cpp lib/device_configuration/NetworkSettings.cpp tests/network_profiles_test.cpp -o "$RUNNER_TEMP/network-profiles-test"
          "$RUNNER_TEMP/network-profiles-test"
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/ble_stubs src/features/network_provisioning/EspIdfNetworkProfileStorage.cpp src/features/network_provisioning/NetworkProfiles.cpp tests/espidf_network_profile_storage_test.cpp -o "$RUNNER_TEMP/network-profile-storage-test"
          "$RUNNER_TEMP/network-profile-storage-test"
          g++ -std=c++14 -Wall -Wextra -Werror src/features/firmware_update/OtaManifest.cpp src/features/firmware_update/OtaPolicy.cpp tests/firmware_update_test.cpp -o "$RUNNER_TEMP/firmware-update-test"
          "$RUNNER_TEMP/firmware-update-test"
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/ota_stubs src/features/firmware_update/OtaManifest.cpp src/features/firmware_update/OtaPolicy.cpp src/features/firmware_update/EspIdfFirmwareUpdate.cpp src/features/physical_effects/PhysicalEffects.cpp src/features/device_control/PersistentCommandJournal.cpp tests/espidf_firmware_update_test.cpp -o "$RUNNER_TEMP/ota-adapter-test"
          "$RUNNER_TEMP/ota-adapter-test"
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Local service discovery lifecycle
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/wifi_stubs -I tests/station_stubs -I lib/device_configuration/include \
            src/features/backend_access/EspIdfWifiStation.cpp \
            lib/device_configuration/NetworkSettings.cpp \
            tests/espidf_wifi_station_test.cpp -o "$RUNNER_TEMP/wifi-station-test"
          "$RUNNER_TEMP/wifi-station-test"
          g++ -std=c++14 -Wall -Wextra -Werror -I tests/discovery_stubs -I tests/station_stubs -I lib/device_configuration/include \
            src/features/local_control/EspIdfLocalServiceAdvertisement.cpp \
            lib/device_configuration/NetworkSettings.cpp \
            src/features/network_provisioning/NetworkProfiles.cpp \
            tests/espidf_local_service_advertisement_test.cpp -o "$RUNNER_TEMP/local-discovery-test"
          "$RUNNER_TEMP/local-discovery-test"
      - name: Local control codec test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/local_control/LocalControlCodec.cpp \
            tests/local_control_codec_test.cpp \
            -o "$RUNNER_TEMP/local-control-codec-test"
          "$RUNNER_TEMP/local-control-codec-test" \
            ../contracts/fixtures/valid/{hello,state-get,control-acquire,control-release,heartbeat,safety-stop,safety-reset,conversation-text,conversation-cancel,selection-start,inventory-confirm-reload,voice-configure,voice-start,voice-stop}.json \
            --reject ../contracts/fixtures/invalid/*.json
      - name: Local control inbox test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/local_control/LocalControlInbox.cpp \
            tests/local_control_inbox_test.cpp \
            -o "$RUNNER_TEMP/local-control-inbox-test"
          "$RUNNER_TEMP/local-control-inbox-test"
      - name: Local WSS server adapter test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread -I tests/server_stubs -I lib/device_configuration/include \
            src/features/local_control/EspIdfLocalControlServer.cpp \
            src/features/local_control/LocalControlCodec.cpp \
            src/features/local_control/LocalControlInbox.cpp \
            src/features/local_control/LocalSocketAdmission.cpp \
            src/features/local_control/LocalBearerAuthenticator.cpp \
            src/features/provisioning/LocalTlsIdentity.cpp \
            src/features/provisioning/LocalPairingCredential.cpp \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            tests/local_control_server_test.cpp \
            -o "$RUNNER_TEMP/local-control-server-test"
          "$RUNNER_TEMP/local-control-server-test" \
            ../contracts/fixtures/valid/hello.json \
            ../contracts/fixtures/valid/safety-stop.json
      - name: Local control output interop test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/safety/SafetyController.cpp \
            src/features/wand_selection/SelectionSequence.cpp \
            src/features/device_control/DeviceControl.cpp \
            src/features/device_control/PersistentCommandJournal.cpp \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/local_control/LocalControlOutput.cpp \
            src/features/device_runtime/DeviceDiagnostics.cpp \
            tests/local_control_output_test.cpp \
            -o "$RUNNER_TEMP/local-control-output-test"
          "$RUNNER_TEMP/local-control-output-test" > "$RUNNER_TEMP/control-output.jsonl"
          node ../contracts/verify-firmware-output.mjs "$RUNNER_TEMP/control-output.jsonl"
      - name: Local control owner test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          # Keep the complete offline/scene dependencies in the shared host list.
          python3 tests/run_show_tests.py --only local_control_owner_test
      - name: Local control session test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror \
            src/features/safety/SafetyController.cpp \
            src/features/wand_selection/SelectionSequence.cpp \
            src/features/device_control/DeviceControl.cpp \
            src/features/device_control/DeviceControlRuntime.cpp \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationTurnFailureInbox.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            src/features/local_control/LocalControlSession.cpp \
            src/features/local_control/LocalConversationGateway.cpp \
            tests/local_control_session_test.cpp \
            -o "$RUNNER_TEMP/local-control-session-test"
          "$RUNNER_TEMP/local-control-session-test"
      - name: Local pairing credential test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread -I lib/device_configuration/include \
            src/features/provisioning/LocalPairingCredential.cpp \
            tests/local_pairing_credential_test.cpp \
            -o "$RUNNER_TEMP/local-pairing-credential-test"
          "$RUNNER_TEMP/local-pairing-credential-test"
      - name: Radio-gated pairing random adapter test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -Itests/idf_stubs -I lib/device_configuration/include \
            src/features/provisioning/EspIdfPairingRandom.cpp \
            tests/espidf_pairing_random_test.cpp \
            -o "$RUNNER_TEMP/espidf-pairing-random-test"
          "$RUNNER_TEMP/espidf-pairing-random-test"
      - name: Local TLS identity test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -I lib/device_configuration/include \
            src/features/provisioning/LocalTlsIdentity.cpp \
            tests/local_tls_identity_test.cpp \
            -o "$RUNNER_TEMP/local-tls-identity-test"
          "$RUNNER_TEMP/local-tls-identity-test"
      - name: Local bearer authorization test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -I lib/device_configuration/include \
            src/features/provisioning/LocalPairingCredential.cpp \
            src/features/local_control/LocalBearerAuthenticator.cpp \
            tests/local_bearer_authenticator_test.cpp \
            -o "$RUNNER_TEMP/local-bearer-authorization-test"
          "$RUNNER_TEMP/local-bearer-authorization-test"
      - name: Local socket admission test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread -I lib/device_configuration/include \
            src/features/provisioning/LocalPairingCredential.cpp \
            src/features/local_control/LocalBearerAuthenticator.cpp \
            src/features/local_control/LocalSocketAdmission.cpp \
            tests/local_socket_admission_test.cpp \
            -o "$RUNNER_TEMP/local-socket-admission-test"
          "$RUNNER_TEMP/local-socket-admission-test"
      - name: Snapshot-bound text inbox test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationTextInbox.cpp \
            tests/conversation_text_inbox_test.cpp \
            -o "$RUNNER_TEMP/conversation-text-inbox-test"
          "$RUNNER_TEMP/conversation-text-inbox-test"
      - name: Snapshot-bound reply inbox test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationReplyInbox.cpp \
            tests/conversation_reply_inbox_test.cpp \
            -o "$RUNNER_TEMP/conversation-reply-inbox-test"
          "$RUNNER_TEMP/conversation-reply-inbox-test"
      - name: Local turn to backend reply correlation test
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationSession.cpp \
            src/features/conversation/ConversationStartCodec.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/ConversationTextInbox.cpp \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/ConversationReplyInbox.cpp \
            tests/conversation_turn_correlation_test.cpp \
            -o "$RUNNER_TEMP/conversation-turn-correlation-test"
          "$RUNNER_TEMP/conversation-turn-correlation-test"
      - name: Conversation proposal and opening tests
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          conversation=(
            src/features/conversation/ConversationSession.cpp
            src/features/conversation/ConversationStartCodec.cpp
          )
          g++ -std=c++14 -Wall -Wextra -Werror \
            "${conversation[@]}" \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/TurnOperationCodec.cpp \
            tests/turn_operation_codec_test.cpp \
            -o "$RUNNER_TEMP/turn-operation-codec-test"
          "$RUNNER_TEMP/turn-operation-codec-test"
          g++ -std=c++14 -Wall -Wextra -Werror \
            "${conversation[@]}" \
            src/features/conversation/ConversationTextCodec.cpp \
            tests/conversation_text_codec_test.cpp \
            -o "$RUNNER_TEMP/conversation-text-codec-test"
          "$RUNNER_TEMP/conversation-text-codec-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            tests/pending_proposal_test.cpp \
            -o "$RUNNER_TEMP/pending-proposal-test"
          "$RUNNER_TEMP/pending-proposal-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/wand_presentation_test.cpp \
            -o "$RUNNER_TEMP/wand-presentation-test"
          "$RUNNER_TEMP/wand-presentation-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            src/features/safety/SafetyController.cpp \
            src/features/wand_selection/SelectionSequence.cpp \
            src/features/device_control/DeviceControl.cpp \
            src/features/device_control/DeviceControlRuntime.cpp \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/autonomous_presentation_lifecycle_test.cpp \
            -o "$RUNNER_TEMP/autonomous-presentation-lifecycle-test"
          "$RUNNER_TEMP/autonomous-presentation-lifecycle-test"
          g++ -std=c++14 -Wall -Wextra -Werror -pthread \
            "${conversation[@]}" \
            src/features/conversation/ConversationRuntimeState.cpp \
            src/features/conversation/PendingProposal.cpp \
            src/features/conversation/TurnPollGuard.cpp \
            src/features/conversation/TurnOperationCodec.cpp \
            src/features/wand_presentation/WandPresentation.cpp \
            tests/turn_replay.cpp \
            -o "$RUNNER_TEMP/turn-replay"

  firmware-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare persistent PlatformIO and compiler cache
        shell: bash
        run: python3 firmware/ci/prepare_build.py
      - name: Build ESP-IDF profile
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 firmware/tools/firmware_version.py --policy firmware/version.txt --run-number "$GITHUB_RUN_NUMBER")"
          echo "Building firmware $version for CI run $GITHUB_RUN_NUMBER"
          # Regenerate PROJECT_VER for a new run on an incremental checkout.
          rm -f firmware/.pio/build/production/CMakeCache.txt
          "$KUFR_PIO" run -d firmware -e production -s
          python3 firmware/tools/ota_release.py check --binary firmware/.pio/build/production/firmware.bin --version "$version"
          mkdir -p "$RUNNER_TEMP/firmware/esp32-s3-idf"
          cp firmware/.pio/build/production/*.bin "$RUNNER_TEMP/firmware/esp32-s3-idf/"
          cp firmware/.pio/build/production/firmware.elf "$RUNNER_TEMP/firmware/esp32-s3-idf/"
      - name: Secured BLE adapter with pinned managed cJSON
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          cjson=managed_components/espressif__cjson/cJSON
          test -f "$cjson/cJSON.c"
          test -f "$cjson/cJSON.h"
          gcc -std=c99 -Wall -Wextra -Werror -I "$cjson" \
            -c "$cjson/cJSON.c" -o "$RUNNER_TEMP/provisioning-cjson.o"
          g++ -std=c++14 -Wall -Wextra -Werror \
            -I tests/ble_stubs -I tests/station_stubs -I "$cjson" -I lib/device_configuration/include \
            src/features/network_provisioning/EspIdfBleProvisioning.cpp \
            src/features/network_provisioning/NetworkProfiles.cpp \
            lib/device_configuration/NetworkSettings.cpp \
            tests/espidf_ble_provisioning_test.cpp \
            "$RUNNER_TEMP/provisioning-cjson.o" -o "$RUNNER_TEMP/ble-provisioning-test"
          "$RUNNER_TEMP/ble-provisioning-test"
      - name: Build USB-only board memory diagnostic
        shell: bash
        run: |
          "$KUFR_PIO" run -d firmware -e diag-board-memory -s
      - name: Build PCA9685 logic diagnostic
        shell: bash
        run: |
          "$KUFR_PIO" run -d firmware -e diag-pca9685-logic -s
      - name: Build single servo bench diagnostic
        shell: bash
        run: |
          "$KUFR_PIO" run -d firmware -e diag-servo-bench -s
      - name: Build hardware service diagnostic with disabled example configuration
        shell: bash
        run: |
          set -euo pipefail
          cd firmware
          python3 diagnostics/hardware-service/make_config.py diagnostics/hardware-service/service_config.example.json
          "$KUFR_PIO" run -e diag-hardware-service -s
      - name: Build physical USB network service without embedded credentials
        shell: bash
        run: |
          set -euo pipefail
          "$KUFR_PIO" run -d firmware -e diag-network-service -s
      - name: Keep compiler cache within 1 GiB per runner
        if: always()
        run: python3 firmware/ci/prepare_build.py --prune-only
      - name: Bundle flashable firmware outputs without device credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/package.py pack "$RUNNER_TEMP/firmware" "$RUNNER_TEMP/firmware-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # PR CI validates packages; explicit main builds retain deployable artifacts.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !github.event.inputs.pr_number
        with:
          name: firmware
          path: ${{ runner.temp }}/firmware-package/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
