name: Verify reusable build

on:
  workflow_call:
    inputs:
      build_run_id:
        type: string
        required: true
      workflow:
        type: string
        required: true
      artifact:
        type: string
        required: true
      signing_kind:
        type: string
        default: ''
    outputs:
      source_sha:
        value: ${{ jobs.verify.outputs.source_sha }}
      main_sha:
        value: ${{ jobs.verify.outputs.main_sha }}
      artifact_digest:
        value: ${{ jobs.verify.outputs.artifact_digest }}
      artifact_id:
        value: ${{ jobs.verify.outputs.artifact_id }}
      run_id:
        value: ${{ jobs.verify.outputs.run_id }}

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
      main_sha: ${{ steps.verify.outputs.main_sha }}
      artifact_digest: ${{ steps.resolve.outputs.artifact_digest }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve a successful run and its immutable artifact
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_WORKFLOW: ${{ inputs.workflow }}
          BUILD_ARTIFACT: ${{ inputs.artifact }}
        with:
          script: |
            await require('./scripts/ci/verify-build.cjs').resolve({ github, context, core }, {
              runId: process.env.BUILD_RUN_ID,
              workflow: process.env.BUILD_WORKFLOW,
              artifact: process.env.BUILD_ARTIFACT,
            });
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.resolve.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build-package
      - name: Verify direct main provenance and exact current commit/tree
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_WORKFLOW: ${{ inputs.workflow }}
          SIGNING_KIND: ${{ inputs.signing_kind }}
        with:
          script: |
            await require('./scripts/ci/verify-build.cjs').verify({ github, context, core }, {
              manifestPath: `${process.env.RUNNER_TEMP}/build-package/build-manifest.json`,
              runId: process.env.BUILD_RUN_ID,
              workflow: process.env.BUILD_WORKFLOW,
              signingKind: process.env.SIGNING_KIND,
            });
      - name: Validate archive checksum and safe extraction
        run: python3 scripts/ci/package.py unpack "$RUNNER_TEMP/build-package" "$RUNNER_TEMP/validated-payload"
