name: Kufr backend bootstrap source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, kufr-backend]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage reviewed bootstrap for the server administrator
        shell: bash
        run: |
          set -euo pipefail
          source_dir=kufr/backend/deploy
          test -f "$source_dir/bootstrap-ubuntu.sh"
          test -f "$source_dir/deploy-helper.py"
          test -f "$source_dir/kufr-backend.service"
          stage_dir="$(mktemp -d "$HOME/kufr-bootstrap.XXXXXXXX")"
          install -m 0400 "$source_dir/bootstrap-ubuntu.sh" "$stage_dir/bootstrap-ubuntu.sh"
          install -m 0400 "$source_dir/deploy-helper.py" "$stage_dir/deploy-helper.py"
          install -m 0400 "$source_dir/kufr-backend.service" "$stage_dir/kufr-backend.service"
          echo "commit=$GITHUB_SHA"
          echo "stage_dir=$stage_dir"
          sha256sum "$stage_dir/bootstrap-ubuntu.sh" "$stage_dir/deploy-helper.py" "$stage_dir/kufr-backend.service"
          echo 'An administrator must verify the hashes and run bootstrap-ubuntu.sh manually.'
