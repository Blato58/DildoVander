name: Verify CAD manufacturing package

on:
  workflow_call:
  # PR caches are scoped to their merge ref. Warm main so later PRs can reuse it.
  push:
    branches: [main]
    paths:
      - 'kufr/mechanika/final/**'
      # Viewer chrome consumes existing geometry; it has a separate site gate.
      - '!kufr/mechanika/final/viewer.js'
      - '!kufr/mechanika/final/viewer-template.html'
      - '!kufr/mechanika/final/viewer-workshop.css'
      - '!kufr/mechanika/final/viewer_style.py'
      - '!kufr/mechanika/final/viewer_document.py'
      - '!kufr/mechanika/final/viewer_ui.py'
      - '!kufr/mechanika/final/viewer_ui.js'
      - '!kufr/mechanika/final/refresh_viewer.py'
      - '!kufr/mechanika/final/workshop-design-system.css'
      - '!kufr/mechanika/final/twin_viewer.js'
      - '!kufr/mechanika/final/twin_media.js'
      - '!kufr/mechanika/final/twin_media.css'
      - '!kufr/mechanika/final/twin-viewer.css'
      - '!kufr/mechanika/final/test_viewer.cjs'
      - '!kufr/mechanika/final/test_viewer_style.py'
      - '!kufr/mechanika/final/test_viewer_document.py'
      - '!kufr/mechanika/final/test_twin_viewer.cjs'
      - '!kufr/mechanika/final/test_twin_media.cjs'
      - '!kufr/mechanika/final/test_twin_media_browser.cjs'
      - '!kufr/mechanika/final/viewer_runtime.py'
      - '!kufr/mechanika/final/workshop-ui-runtime.js'
      - '!kufr/mechanika/final/ui_test_runtime.cjs'
      - '!kufr/mechanika/final/preview_ui_fixture.py'
      - '!kufr/mechanika/final/show_timeline.js'
      - '!kufr/mechanika/final/test_show_timeline.cjs'
      - '!kufr/mechanika/final/VIEWER.md'
      - 'kufr/mechanika/rozmery-nakoupenych-soucastek.md'
      - 'kufr/docs/zapojeni-potvrzeneho-hardwaru.md'
      - 'scripts/ci/install-cad-slicer.sh'
      - 'scripts/ci/cad_cache.py'
      - 'scripts/ci/test_cad_cache.py'
      - 'kufr/mobilni-aplikace/.nvmrc'
      - '.github/actions/verified-cad/**'
      - '.github/workflows/kufr-cad.yml'

permissions:
  contents: read

concurrency:
  # Background main warming must not cancel a requested recovery verification.
  group: cad-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
      - name: Verify source-bound CAD outputs
        uses: ./.github/actions/verified-cad
