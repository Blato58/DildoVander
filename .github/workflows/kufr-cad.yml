name: Verify CAD manufacturing package

on:
  workflow_call:
    inputs:
      force:
        description: Regenerate complete CAD without reusing verified outputs
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate complete CAD without reusing verified outputs
        type: boolean
        default: false
  # Main warms trusted results. Irrelevant pushes stop before any tool setup.
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  # Background main warming must not cancel a requested recovery verification.
  group: cad-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select manufacturing impact before installing tools
        id: impact
        env:
          CAD_EVENT: ${{ github.event_name }}
          CAD_BASE: ${{ github.event.before }}
          CAD_HEAD: ${{ github.sha }}
        run: |
          if [ "$CAD_EVENT" = push ] && [ "$CAD_BASE" != 0000000000000000000000000000000000000000 ]; then
            python3 scripts/ci/select_projects.py select --base "$CAD_BASE" --head "$CAD_HEAD"
          else
            echo 'cad=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.impact.outputs.cad == 'true'
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
      - name: Verify source-bound CAD outputs
        if: steps.impact.outputs.cad == 'true'
        uses: ./.github/actions/verified-cad
        with:
          force: ${{ inputs.force || false }}
