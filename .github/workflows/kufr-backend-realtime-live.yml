name: Kufr Realtime live test

on:
  workflow_dispatch:
    inputs:
      approved_budget_usd:
        description: Explicitly approved maximum budget in USD
        type: choice
        options: ['1']
        required: true

permissions:
  contents: read

concurrency:
  group: kufr-backend-production
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: backend-production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install offline synthetic Czech speech
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Test one bounded hands-free conversation
        env:
          PUBLIC_IPV4: ${{ vars.KUFR_BACKEND_PUBLIC_IPV4 }}
          DEVICE_ID: ${{ secrets.DEVICE_ID }}
          DEV_DEVICE_CREDENTIAL: ${{ secrets.DEV_DEVICE_CREDENTIAL }}
          SESSION_CAP_MICRO_USD: ${{ secrets.SESSION_CAP_MICRO_USD }}
          DAILY_CAP_MICRO_USD: ${{ secrets.DAILY_CAP_MICRO_USD }}
          MONTHLY_CAP_MICRO_USD: ${{ secrets.MONTHLY_CAP_MICRO_USD }}
          APPROVED_BUDGET_USD: ${{ inputs.approved_budget_usd }}
          REPORT_PATH: ${{ runner.temp }}/realtime-live-report.json
        run: python3 kufr/backend/tests/realtime_live_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: realtime-live-report
          path: ${{ runner.temp }}/realtime-live-report.json
          retention-days: 7
