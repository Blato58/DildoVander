name: Build Wand Night Stand App Store IPA
run-name: ${{ inputs.release_request != '' && format('Main release | {0}', inputs.release_request) || 'Build Wand Night Stand App Store IPA' }}

on:
  workflow_dispatch:
    inputs:
      release_request:
        description: Internal main release correlation UUID (empty for manual recovery)
        type: string
      build_run_id:
        description: Successful CI run ID for current main
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: kufr-ios-app-store
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Duloc-Dungeon/DildoVander' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reuse-build.yml
    with:
      build_run_id: ${{ inputs.build_run_id }}
      workflow: ci.yml
      artifact: web-dist

  signed-ipa:
    if: github.repository == 'Duloc-Dungeon/DildoVander' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    timeout-minutes: 25
    runs-on: macos-15
    environment: ios-app-store
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: mobilni-aplikace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.main_sha }}
          persist-credentials: false
      - name: Reject a signing build queued before main changed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.main_sha }}
        with:
          script: await require('./scripts/ci/verify-build.cjs').checkMain({ github, context }, process.env.EXPECTED_SHA)
      - name: Check Xcode
        run: test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"
      - name: Test signing guards and cleanup without credentials
        run: |
          python3 -m unittest discover -s scripts -p 'test_configure_ios_signing.py'
          python3 -m unittest discover -s scripts -p 'test_validate_ios_profile.py'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobilni-aplikace/package-lock.json
            contracts/package-lock.json
            firmware/simulator/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../contracts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/web-package
      - name: Reuse tested web build
        working-directory: .
        run: python3 scripts/ci/package.py unpack "$RUNNER_TEMP/web-package" mobilni-aplikace/dist
      - run: npx cap sync ios
      - name: Generate original native assets
        run: node scripts/generate-native-assets.mjs
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Test native pinned LAN transport
        run: |
          npm ci --prefix ../firmware/simulator
          bash scripts/test-native-transport.sh
      - name: Test native debug backend client
        run: bash scripts/test-native-debug.sh
      - name: Test secure BLE status and secret whitelist
        run: bash scripts/test-native-provisioning.sh
      - name: Recheck main immediately before signing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.main_sha }}
        with:
          script: await require('./scripts/ci/verify-build.cjs').checkMain({ github, context }, process.env.EXPECTED_SHA)
      - name: Export App Store IPA (no upload)
        env:
          IOS_BUNDLE_ID: de.dildovander.companion
          IOS_TEAM_ID: ${{ vars.IOS_APP_STORE_TEAM_ID }}
          KUFR_PASSKEY_RP_DOMAIN: ${{ vars.KUFR_PASSKEY_RP_DOMAIN }}
          IOS_SIGNING_KIND: app_store
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_APP_STORE_CERTIFICATE_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_APP_STORE_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_APP_STORE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Reserve the third component for reruns so each attempt has a unique version.
          # The signing script rejects components outside Apple's numeric limits.
          export IOS_BUILD_NUMBER="$((1 + GITHUB_RUN_NUMBER / 100)).$((GITHUB_RUN_NUMBER % 100)).${GITHUB_RUN_ATTEMPT}"
          bash scripts/build-ios-ipa.sh
      - name: Package signed IPA with provenance
        working-directory: .
        env:
          SIGNING_KIND: app_store
        run: |
          python3 scripts/ci/package.py pack mobilni-aplikace/dist/ipa "$RUNNER_TEMP/ipa-package"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'ipa-package/build-manifest.json'
          manifest = json.loads(path.read_text())
          manifest['signing_kind'] = os.environ['SIGNING_KIND']
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PYCODE
      - name: Save signed IPA and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-store-ipa
          path: ${{ runner.temp }}/ipa-package/
          if-no-files-found: error
          retention-days: 3
          overwrite: true
