name: Build Arcane Workshop site

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    timeout-minutes: 75
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate isolated site staging
        run: |
          site_work=$(mktemp -d "$RUNNER_TEMP/arcane-site.XXXXXX")
          echo "SITE_WORK=$site_work" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: kufr/mechanika/final/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: kufr/mobilni-aplikace/package-lock.json
      - name: Install pinned CAD dependencies
        run: |
          python -m venv "$RUNNER_TEMP/cad-venv"
          "$RUNNER_TEMP/cad-venv/bin/python" -m pip install -r kufr/mechanika/final/requirements.txt
          echo "$RUNNER_TEMP/cad-venv/bin" >> "$GITHUB_PATH"
      - name: Install official pinned PrusaSlicer CLI
        timeout-minutes: 15
        run: xvfb-run -a bash scripts/ci/install-cad-slicer.sh
      - name: Validate public-site promotion and archive integrity
        run: |
          python -m unittest discover -s kufr/web -p 'test_*.py'
          python -m unittest discover -s kufr/mechanika/final -p test_viewer_style.py
      - name: Fingerprint CAD sources and runtime
        id: cad-key
        run: |
          cad_key=$(xvfb-run -a python kufr/mechanika/final/regenerate.py --cache-key)
          echo "key=$cad_key" >> "$GITHUB_OUTPUT"
      - name: Restore verified manufacturing outputs
        id: cad-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kufr/mechanika/final/exports
          key: cad-verified-v1-${{ steps.cad-key.outputs.key }}
      - name: Regenerate and verify the complete manufacturing package
        run: xvfb-run -a pwsh -NoProfile -File ./kufr/mechanika/final/Regenerate.ps1 -Python python
      - name: Save verified manufacturing outputs
        if: steps.cad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kufr/mechanika/final/exports
          key: cad-verified-v1-${{ steps.cad-key.outputs.key }}
      - name: Build browser Companion with its deployed path
        working-directory: kufr/mobilni-aplikace
        run: |
          npm ci
          npm ci --prefix ../contracts
          npm run build -- --base=/companion/
      - name: Assemble verified site
        run: python kufr/web/build-site.py --destination "$SITE_WORK/source" --web-dist kufr/mobilni-aplikace/dist
      - name: Package with source provenance
        run: python scripts/ci/package.py pack "$SITE_WORK/source" "$SITE_WORK/package"
      - name: Upload immutable main package
        id: package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # PR checks package locally; only explicit main builds retain a deployable artifact.
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !github.event.inputs.pr_number
        with:
          name: arcane-site
          path: ${{ env.SITE_WORK }}/package/
          if-no-files-found: error
          retention-days: 1
      - name: Remove hosted site staging
        if: always() && env.SITE_WORK != ''
        run: |
          case "$SITE_WORK" in
            "$RUNNER_TEMP"/arcane-site.*) rm -rf -- "$SITE_WORK" ;;
            *) echo 'Refusing unexpected staging path' >&2; exit 1 ;;
          esac
