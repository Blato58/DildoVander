name: Build Vapour Chrome site

on:
  workflow_call:
    inputs:
      verify-manufacturing:
        description: Build the complete verified site package for a main recovery build
        type: boolean
        default: true
      force-cad:
        description: Regenerate complete CAD without reusing verified outputs
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    timeout-minutes: 75
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate isolated site staging
        run: |
          site_work=$(mktemp -d "$RUNNER_TEMP/arcane-site.XXXXXX")
          echo "SITE_WORK=$site_work" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: |
            kufr/mobilni-aplikace/package-lock.json
            kufr/contracts/package-lock.json
      - name: Validate public-site promotion and archive integrity
        run: |
          python scripts/generate_design_tokens.py --check
          npm test --prefix kufr/design-system
          python -m unittest discover -s kufr/web -p 'test_*.py'
          python -m unittest discover -s kufr/mechanika/final -p test_viewer_style.py
          python -m unittest discover -s kufr/mechanika/final -p test_viewer_document.py
          python -m unittest discover -s kufr/mechanika/final -p test_twin_manifest.py
          python kufr/mechanika/final/generate_effects.py --check
          python -m unittest discover -s kufr/mechanika/final -p test_effects.py
          node --test kufr/mechanika/final/test_viewer.cjs kufr/mechanika/final/test_twin_viewer.cjs kufr/mechanika/final/test_twin_media.cjs kufr/mechanika/final/test_show_timeline.cjs
          node --test kufr/firmware/diagnostics/servo-bench/web/tests/*.test.mjs
          python -m unittest discover -s kufr/firmware/diagnostics/servo-bench/web/tests -p 'test_*.py'
      - name: Verify simulator UI consumers
        run: node kufr/simulator/verify-dashboard.mjs
      - name: Verify source-bound CAD outputs for a complete site package
        if: inputs.verify-manufacturing
        uses: ./.github/actions/verified-cad
        with:
          force: ${{ inputs.force-cad }}
      - name: Build browser Companion with its deployed path
        working-directory: kufr/mobilni-aplikace
        run: |
          npm ci
          npm ci --prefix ../contracts
          npm run build -- --base=/companion/
      - name: Verify responsive UI and private/public guest flows in Chromium
        env:
          NODE_PATH: ${{ github.workspace }}/kufr/design-system/node_modules
          DV10_BROWSER_CHANNEL: chromium
          UI_MOBILE_DIST: ${{ github.workspace }}/kufr/mobilni-aplikace/dist
          UI_VIEWER_HTML: ${{ runner.temp }}/viewer-ui-fixture.html
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/ui-screenshots
        run: |
          npm ci --prefix kufr/design-system
          npx --prefix kufr/design-system playwright install --with-deps chromium
          python kufr/mechanika/final/preview_ui_fixture.py --output "$UI_VIEWER_HTML"
          npm run test:browser --prefix kufr/design-system
          node kufr/web/keepsake/test-browser.cjs
          node kufr/web/keepsake/test-evening-browser.cjs
      - name: Check assembly with real site assets and synthetic CAD fixtures
        env:
          KUFR_SITE_WEB_DIST: ${{ github.workspace }}/kufr/mobilni-aplikace/dist
        run: python -m unittest discover -s kufr/web -p test_site_inputs.py
      - name: Assemble verified site
        if: inputs.verify-manufacturing
        run: python kufr/web/build-site.py --destination "$SITE_WORK/source" --web-dist kufr/mobilni-aplikace/dist
      - name: Package with source provenance
        if: inputs.verify-manufacturing
        run: python scripts/ci/package.py pack "$SITE_WORK/source" "$SITE_WORK/package"
      - name: Upload immutable main package
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # PR checks package locally; only explicit main builds retain a deployable artifact.
        if: inputs.verify-manufacturing && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !github.event.inputs.pr_number
        with:
          name: arcane-site
          path: ${{ env.SITE_WORK }}/package/
          if-no-files-found: error
          retention-days: 1
      - name: Remove hosted site staging
        if: always() && env.SITE_WORK != ''
        run: |
          case "$SITE_WORK" in
            "$RUNNER_TEMP"/arcane-site.*) rm -rf -- "$SITE_WORK" ;;
            *) echo 'Refusing unexpected staging path' >&2; exit 1 ;;
          esac
