name: Build Arcane Workshop site

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: kufr/mechanika/final/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: kufr/mobilni-aplikace/package-lock.json
      - name: Install pinned CAD dependencies
        run: python -m pip install -r kufr/mechanika/final/requirements.txt
      - name: Validate public-site promotion and archive integrity
        run: python -m unittest discover -s kufr/web -p 'test_*.py'
      - name: Regenerate and verify the complete manufacturing package
        shell: pwsh
        run: ./kufr/mechanika/final/Regenerate.ps1 -Python python
      - name: Build browser Companion with its deployed path
        working-directory: kufr/mobilni-aplikace
        run: |
          npm ci
          npm ci --prefix ../contracts
          npm run build -- --base=/companion/
      - name: Assemble verified site
        run: python kufr/web/build-site.py --destination "$RUNNER_TEMP/arcane-site" --web-dist kufr/mobilni-aplikace/dist
      - name: Package with source provenance
        run: python scripts/ci/package.py pack "$RUNNER_TEMP/arcane-site" "$RUNNER_TEMP/arcane-package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arcane-site
          path: ${{ runner.temp }}/arcane-package/
          if-no-files-found: error
          retention-days: 14
