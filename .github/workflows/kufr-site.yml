name: Build DildoVander application

on:
  workflow_call:
    inputs:
      reuse-web-dist:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    timeout-minutes: 20
    env:
      NPM_CONFIG_FETCH_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate isolated application staging
        run: |
          site_work=$(mktemp -d "$RUNNER_TEMP/dildovander-app.XXXXXX")
          echo "SITE_WORK=$site_work" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobilni-aplikace/package-lock.json
            contracts/package-lock.json
      - name: Guard application and viewer CI independence
        run: python scripts/ci/ui_boundary.py
      - name: Validate application packaging and viewer fixtures
        run: |
          python scripts/generate_design_tokens.py --check
          npm test --prefix design-system
          python -m unittest discover -s web -p 'test_*.py'
          python -m unittest discover -s web/deploy -p 'test_*.py'
          python -m unittest discover -s mechanika/final -p test_viewer_style.py
          python -m unittest discover -s mechanika/final -p test_viewer_document.py
          python -m unittest discover -s mechanika/final -p test_twin_manifest.py
          python mechanika/final/generate_effects.py --check
          python -m unittest discover -s mechanika/final -p test_effects.py
          python -m unittest discover -s mechanika/final -p test_model_bundle_export.py
          python -m unittest discover -s mechanika/final -p test_model_verification.py
          node --test mechanika/final/test_viewer.cjs mechanika/final/test_twin_viewer.cjs mechanika/final/test_twin_media.cjs mechanika/final/test_show_timeline.cjs
          node --test firmware/diagnostics/servo-bench/web/tests/*.test.mjs
          python -m unittest discover -s firmware/diagnostics/servo-bench/web/tests -p 'test_*.py'
          node firmware/simulator/verify-dashboard.mjs
      - name: Install shared application browser dependencies
        working-directory: mobilni-aplikace
        run: |
          npm ci
          npm ci --prefix ../contracts
      - name: Reuse compiled application from web checks
        if: inputs.reuse-web-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-web-dist
          path: mobilni-aplikace/dist/
      - name: Build shared application at its canonical root
        if: '!inputs.reuse-web-dist'
        working-directory: mobilni-aplikace
        run: |
          npm test --prefix ../contracts
          npm test
          npm run build
      - name: Verify shared application browser journeys
        working-directory: mobilni-aplikace
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run test:persona-lab:browser
          node tests/debug.browser.mjs
          node tests/director.browser.mjs
          node scripts/archive-show.browser.mjs
          node tests/workshop-offline.browser.mjs
          node tests/workshop-media.browser.mjs
      - name: Check real compiled application inputs without CAD
        env:
          KUFR_SITE_WEB_DIST: ${{ github.workspace }}/mobilni-aplikace/dist
        run: python -m unittest discover -s web -p test_site_inputs.py
      - name: Assemble application
        run: python web/build-site.py --destination "$SITE_WORK/source" --web-dist mobilni-aplikace/dist
      - name: Package with source provenance
        run: python scripts/ci/package.py pack "$SITE_WORK/source" "$SITE_WORK/package"
      - name: Upload immutable main package
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # PR checks package locally; only explicit main builds retain a deployable artifact.
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !github.event.inputs.pr_number
        with:
          name: arcane-site
          path: ${{ env.SITE_WORK }}/package/
          if-no-files-found: error
          retention-days: 1
      - name: Remove hosted application staging
        if: always() && env.SITE_WORK != ''
        run: |
          case "$SITE_WORK" in
            "$RUNNER_TEMP"/dildovander-app.*) rm -rf -- "$SITE_WORK" ;;
            *) echo 'Refusing unexpected staging path' >&2; exit 1 ;;
          esac
