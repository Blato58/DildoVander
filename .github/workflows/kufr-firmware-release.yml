name: Publish signed Kufr firmware OTA

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful firmware CI run for merged/current main
        type: string
        required: true
      channel:
        description: Signing authority (stable requires separately provisioned production key)
        type: choice
        options: [development, stable]
        default: development

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: kufr-firmware-publication
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Blato58/DildoVander' && github.event.repository.private == true && (github.ref == 'refs/heads/main')
    uses: ./.github/workflows/reuse-build.yml
    with:
      build_run_id: ${{ inputs.build_run_id }}
      workflow: ci.yml
      artifact: firmware
  publish:
    if: github.repository == 'Blato58/DildoVander' && github.event.repository.private == true && (github.ref == 'refs/heads/main')
    needs: verify
    runs-on: [self-hosted, Linux, X64, kufr-backend]
    environment: backend-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.main_sha }}
          persist-credentials: false
      - name: Reject stale publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.main_sha }}
        with:
          script: await require('./scripts/ci/verify-build.cjs').checkMain({ github, context }, process.env.EXPECTED_SHA)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ota-package
      - name: Unpack verified firmware
        shell: bash
        run: python3 scripts/ci/package.py unpack "$RUNNER_TEMP/ota-package" "$RUNNER_TEMP/ota-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Read the verified CI run counter
        id: build-version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.BUILD_RUN_ID),
            });
            if (!Number.isSafeInteger(run.run_number) || run.run_number < 1) throw new Error('Invalid CI run counter');
            core.setOutput('run_number', run.run_number);
      - name: Sign and atomically publish using root-owned authority
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          CHANNEL: ${{ inputs.channel }}
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          BUILD_RUN_NUMBER: ${{ steps.build-version.outputs.run_number }}
        run: |
          set -euo pipefail
          version="$(python3 kufr/firmware/tools/firmware_version.py --policy kufr/firmware/version.txt --run-number "$BUILD_RUN_NUMBER")"
          python3 kufr/firmware/tools/ota_release.py check --version "$version" --binary "$RUNNER_TEMP/ota-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/esp32-s3-idf/firmware.bin"
          printf '%s' "$ARTIFACT_READ_TOKEN" | sudo -n /usr/local/sbin/kufr-firmware-publish "$RUNNER_TEMP/ota-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/esp32-s3-idf/firmware.bin" "$BUILD_RUN_ID" "$CHANNEL"
