name: CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.release_request != '' && format('Main release | {0}', inputs.release_request) || github.event_name == 'workflow_dispatch' && format('CI candidate | {0} | PR {1} | {2} | {3} | project={4}', github.repository, inputs.pr_number || 0, inputs.expected_head_sha || github.sha, inputs.expected_base_sha || github.sha, inputs.project || 'all') || (github.event.pull_request.stack.number && format('CI stack {0} {1} | {2} | PR {3} | {4} | trunk {5} | layer {6}/{7}', github.event.pull_request.stack.number, github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'validation', github.repository, github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.stack.base.sha, github.event.pull_request.stack.position, github.event.pull_request.stack.size)) || format('CI {0} | {1} | PR {2} | {3} | {4}', github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'validation', github.repository, github.event.pull_request.number || 0, github.event.pull_request.head.sha || github.sha, github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha) }}

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      release_request:
        description: Internal main release correlation UUID (empty for manual recovery)
        type: string
      project:
        description: Project to rebuild for an artifact on the current tree
        type: choice
        default: all
        options: [all, repository, backend, firmware, web, ios, ai-eval, site]
      pr_number:
        description: Internal synchronized PR number (empty for recovery builds)
        type: string
      expected_head_sha:
        description: Internal synchronized PR head SHA
        type: string
      expected_base_sha:
        description: Internal synchronized target SHA
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Native pushes can emit sibling validation events out of creation order.
  # Let each finish truthfully: canceling a sibling can leave a failing required
  # check on the same head even when another exact-prefix validation succeeds.
  group: ci-${{ github.event.action == 'edited' && !github.event.changes.base && format('metadata-{0}', github.run_id) || (github.event.pull_request.stack.number && format('stack-{0}-{1}', github.event.pull_request.number, github.run_id)) || github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.stack.number) || inputs.pr_number != '' }}

jobs:
  secret-scan:
    name: Secret scan
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify secret detection and false-positive regressions
        run: GITLEAKS_BINARY="$RUNNER_TEMP/gitleaks" python3 -m unittest discover -s scripts/ci -p 'test_secret_scan.py'
      - name: Scan checkout history without logging secret values
        # HEAD includes the PR merge and its ancestors, including removed secrets.
        # Other fetched branches/tags are independent of this checkout.
        run: '"$RUNNER_TEMP/gitleaks" git --config=.gitleaks.toml --redact=100 --no-banner --log-opts=HEAD'

  changes:
    name: Select changed projects
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      repository: ${{ steps.projects.outputs.repository }}
      backend: ${{ steps.projects.outputs.backend }}
      firmware: ${{ steps.projects.outputs.firmware }}
      web: ${{ steps.projects.outputs.web }}
      ios: ${{ steps.projects.outputs.ios }}
      ai-eval: ${{ steps.projects.outputs.ai-eval }}
      site: ${{ steps.projects.outputs.site }}
      native_stack_revision: ${{ steps.projects.outputs.native_stack_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject stale PR builds before selecting projects
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha }}
        with:
          script: |
            if (!process.env.PR_NUMBER && !process.env.PR_HEAD && !process.env.PR_BASE) {
              if (context.eventName !== 'merge_group' && context.ref !== 'refs/heads/main') {
                throw new Error('Recovery builds must use main');
              }
              return;
            }
            if (context.eventName === 'workflow_dispatch' && context.sha !== process.env.PR_HEAD) {
              throw new Error('Dispatch branch changed before CI started');
            }
            const current = await require('./scripts/ci/pr-freshness.cjs').check({ github, context }, {
              number: process.env.PR_NUMBER, head: process.env.PR_HEAD, base: process.env.PR_BASE,
            });
            if (context.eventName === 'workflow_dispatch'
                && (context.ref !== `refs/heads/${current.pr.head.ref}`
                    || current.pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`)) {
              throw new Error('Dispatch must build the same-repository PR branch');
            }
      - name: Select builds from the complete PR diff
        id: projects
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.stack.base.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.expected_base_sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || inputs.expected_head_sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          CI_STACK_NUMBER: ${{ github.event.pull_request.stack.number }}
          CI_STACK_POSITION: ${{ github.event.pull_request.stack.position }}
          CI_STACK_SIZE: ${{ github.event.pull_request.stack.size }}
          CI_STACK_BASE_REF: ${{ github.event.pull_request.stack.base.ref }}
          CI_STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha }}
          CI_STACK_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_PROJECT: ${{ inputs.project || 'all' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$CI_EVENT_NAME" = workflow_dispatch ] && [ -z "$CI_PR_NUMBER" ]; then
            python3 scripts/ci/select_projects.py select --project "$CI_PROJECT"
          elif [ "$CI_EVENT_NAME" = pull_request ] && [ -n "$CI_STACK_NUMBER" ]; then
            python3 scripts/ci/select_projects.py select --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" \
              --stack-pr "$CI_PR_NUMBER" --stack-number "$CI_STACK_NUMBER" \
              --stack-position "$CI_STACK_POSITION" --stack-size "$CI_STACK_SIZE" \
              --stack-base-ref "$CI_STACK_BASE_REF" --stack-base-sha "$CI_STACK_BASE_SHA" \
              --stack-head-ref "$CI_STACK_HEAD_REF"
          else
            python3 scripts/ci/select_projects.py select --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA"
          fi

  repository:
    name: Repository checks
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: contracts/.nvmrc
      - name: Install pinned workflow validator
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate all workflows
        run: |
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Test artifact provenance and promotion guards
        run: node --test scripts/ci/*.test.cjs
      - name: Test artifact integrity and safe extraction
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Test model workflow contracts with small synthetic data
        run: |
          python3 -m unittest discover -s mechanika/final -p test_fast_build.py
          python3 -m unittest discover -s web/deploy -p test_cad_host.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Verify Vapour Chrome design integrity
        run: |
          python3 scripts/generate_design_tokens.py --check
          npm test --prefix design-system
          python3 -m unittest discover -s scripts -p 'test_design_system.py'
          python3 scripts/check_design_system.py

  stack-proof:
    name: Stack proof ${{ needs.changes.outputs.native_stack_revision }}
    if: needs.changes.outputs.native_stack_revision != ''
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Bind validation to current ordered stack membership
        env:
          STACK_REVISION: ${{ needs.changes.outputs.native_stack_revision }}
        run: test -n "$STACK_REVISION"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/kufr-backend.yml
  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    uses: ./.github/workflows/kufr-firmware.yml
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/kufr-web.yml
    with:
      share-web-dist: ${{ needs.changes.outputs.site == 'true' }}
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/kufr-ios.yml
  ai-eval:
    needs: changes
    if: needs.changes.outputs.ai-eval == 'true'
    uses: ./.github/workflows/kufr-ai-eval.yml

  site:
    needs: [changes, web]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.site == 'true' && ((needs.changes.outputs.web == 'true' && needs.web.result == 'success') || (needs.changes.outputs.web == 'false' && needs.web.result == 'skipped'))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/kufr-site.yml
    with:
      reuse-web-dist: ${{ needs.changes.outputs.web == 'true' }}

  required:
    name: CI required
    if: always()
    needs: [secret-scan, changes, repository, backend, firmware, web, ios, ai-eval, site, stack-proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    env:
      RESULTS: ${{ toJSON(needs) }}
      SELECTED_PROJECTS: ${{ toJSON(needs.changes.outputs) }}
      NATIVE_STACK_REVISION: ${{ needs.changes.outputs.native_stack_revision }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require secret scan and selected builds to succeed
        if: github.event.action != 'edited' || github.event.changes.base != null
        run: |
          if [ "$SECRET_SCAN_RESULT" != success ]; then
            echo 'Secret scan did not succeed' >&2
            exit 1
          fi
          python3 scripts/ci/select_projects.py check
      - name: Verify existing validation for metadata-only edits
        if: github.event.action == 'edited' && github.event.changes.base == null
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/verify_metadata_gate.py
