name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/ci/**'
      - 'kufr/backend/**'
      - 'kufr/backend-tests/**'
      - 'kufr/firmware/**'
      - 'kufr/mobilni-aplikace/**'
      - 'kufr/contracts/**'
      - 'kufr/simulator/**'
      - 'kufr/ai-eval/**'
      - 'kufr/global.json'
      - 'kufr/Directory.Build.props'
      - '!**/*.md'
      - '!**/*.MD'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/docs/**'
  workflow_dispatch:
    inputs:
      project:
        description: Project to rebuild for an artifact on the current tree
        type: choice
        default: all
        options: [all, repository, backend, firmware, web, ai-eval]
      pr_number:
        description: Internal synchronized PR number (empty for recovery builds)
        type: string
      expected_head_sha:
        description: Internal synchronized PR head SHA
        type: string
      expected_base_sha:
        description: Internal synchronized target SHA
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_number != '' }}

jobs:
  changes:
    name: Select changed projects
    runs-on: [self-hosted, Linux, X64, kufr-backend]
    timeout-minutes: 3
    outputs:
      repository: ${{ steps.projects.outputs.repository }}
      backend: ${{ steps.projects.outputs.backend }}
      firmware: ${{ steps.projects.outputs.firmware }}
      web: ${{ steps.projects.outputs.web }}
      ai-eval: ${{ steps.projects.outputs.ai-eval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject stale PR builds before selecting projects
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha }}
        with:
          script: |
            if (!process.env.PR_NUMBER && !process.env.PR_HEAD && !process.env.PR_BASE) {
              if (context.ref !== 'refs/heads/main') throw new Error('Recovery builds must use main');
              return;
            }
            if (context.eventName === 'workflow_dispatch' && context.sha !== process.env.PR_HEAD) {
              throw new Error('Dispatch branch changed before CI started');
            }
            const current = await require('./scripts/ci/pr-freshness.cjs').check({ github, context }, {
              number: process.env.PR_NUMBER, head: process.env.PR_HEAD, base: process.env.PR_BASE,
            });
            if (context.eventName === 'workflow_dispatch'
                && (context.ref !== `refs/heads/${current.pr.head.ref}`
                    || current.pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`)) {
              throw new Error('Dispatch must build the same-repository PR branch');
            }
      - name: Select builds from the complete PR diff
        id: projects
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          CI_PROJECT: ${{ inputs.project || 'all' }}
        run: |
          if [ "$CI_EVENT_NAME" = workflow_dispatch ] && [ -z "$CI_PR_NUMBER" ]; then
            python3 scripts/ci/select_projects.py select --project "$CI_PROJECT"
          else
            python3 scripts/ci/select_projects.py select --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA"
          fi

  repository:
    name: Repository checks
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: [self-hosted, Linux, X64, kufr-backend]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: kufr/contracts/.nvmrc
      - name: Install pinned workflow validator
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate all workflows
        run: |
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Test artifact provenance and promotion guards
        run: node --test scripts/ci/*.test.cjs
      - name: Test artifact integrity and safe extraction
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/kufr-backend.yml
  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    uses: ./.github/workflows/kufr-firmware.yml
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/kufr-web.yml
  ai-eval:
    needs: changes
    if: needs.changes.outputs.ai-eval == 'true'
    uses: ./.github/workflows/kufr-ai-eval.yml

  required:
    name: CI required
    if: always()
    needs: [changes, repository, backend, firmware, web, ai-eval]
    runs-on: [self-hosted, Linux, X64, kufr-backend]
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
      SELECTED_PROJECTS: ${{ toJSON(needs.changes.outputs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require selected builds to succeed and unrelated builds to be skipped
        run: python3 scripts/ci/select_projects.py check
