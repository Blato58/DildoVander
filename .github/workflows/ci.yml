name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      project:
        description: Project to rebuild for an artifact on the current tree
        type: choice
        default: all
        options: [all, repository, backend, firmware, web, ios, ai-eval, site, cad]
      force_cad:
        description: Regenerate complete CAD even when a verified cache exists
        type: boolean
        default: false
      pr_number:
        description: Internal synchronized PR number (empty for recovery builds)
        type: string
      expected_head_sha:
        description: Internal synchronized PR head SHA
        type: string
      expected_base_sha:
        description: Internal synchronized target SHA
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_number != '' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify secret detection and false-positive regressions
        run: GITLEAKS_BINARY="$RUNNER_TEMP/gitleaks" python3 -m unittest discover -s scripts/ci -p 'test_secret_scan.py'
      - name: Scan checkout history without logging secret values
        # HEAD includes the PR merge and its ancestors, including removed secrets.
        # Other fetched branches/tags are independent of this checkout.
        run: '"$RUNNER_TEMP/gitleaks" git --config=.gitleaks.toml --redact=100 --no-banner --log-opts=HEAD'

  changes:
    name: Select changed projects
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      repository: ${{ steps.projects.outputs.repository }}
      backend: ${{ steps.projects.outputs.backend }}
      firmware: ${{ steps.projects.outputs.firmware }}
      web: ${{ steps.projects.outputs.web }}
      ios: ${{ steps.projects.outputs.ios }}
      ai-eval: ${{ steps.projects.outputs.ai-eval }}
      site: ${{ steps.projects.outputs.site }}
      cad: ${{ steps.projects.outputs.cad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject stale PR builds before selecting projects
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha }}
        with:
          script: |
            if (!process.env.PR_NUMBER && !process.env.PR_HEAD && !process.env.PR_BASE) {
              if (context.eventName !== 'merge_group' && context.ref !== 'refs/heads/main') {
                throw new Error('Recovery builds must use main');
              }
              return;
            }
            if (context.eventName === 'workflow_dispatch' && context.sha !== process.env.PR_HEAD) {
              throw new Error('Dispatch branch changed before CI started');
            }
            const current = await require('./scripts/ci/pr-freshness.cjs').check({ github, context }, {
              number: process.env.PR_NUMBER, head: process.env.PR_HEAD, base: process.env.PR_BASE,
            });
            if (context.eventName === 'workflow_dispatch'
                && (context.ref !== `refs/heads/${current.pr.head.ref}`
                    || current.pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`)) {
              throw new Error('Dispatch must build the same-repository PR branch');
            }
      - name: Select builds from the complete PR diff
        id: projects
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.expected_base_sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || inputs.expected_head_sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          CI_PROJECT: ${{ inputs.project || 'all' }}
          FORCE_CAD: ${{ inputs.force_cad && inputs.pr_number == '' }}
        run: |
          if [ "$CI_EVENT_NAME" = workflow_dispatch ] && [ -z "$CI_PR_NUMBER" ]; then
            extra=()
            if [ "$FORCE_CAD" = true ]; then extra+=(--force-cad); fi
            python3 scripts/ci/select_projects.py select --project "$CI_PROJECT" "${extra[@]}"
          else
            python3 scripts/ci/select_projects.py select --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA"
          fi

  repository:
    name: Repository checks
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: kufr/contracts/.nvmrc
      - name: Install pinned workflow validator
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate all workflows
        run: |
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Test artifact provenance and promotion guards
        run: node --test scripts/ci/*.test.cjs
      - name: Test artifact integrity and safe extraction
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  tracking:
    name: Project tracking (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test tracking and validate the committed snapshot
        shell: python
        env:
          PYTHONUTF8: '1'
          TRACKING_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.expected_base_sha }}
        run: |
          import os
          import subprocess
          import sys

          baseline = os.environ.get('TRACKING_BASE_SHA') or 'HEAD^'
          commands = [
              ['--version'],
              ['-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'test_project_status.py'],
              ['scripts/project_status.py', 'validate', '--base', baseline],
              ['scripts/project_status.py', 'verify-evidence'],
              ['scripts/project_status.py', 'migration-check'],
              ['scripts/project_status.py', 'render', '--check'],
          ]
          for command in commands:
              subprocess.run([sys.executable, *command], check=True)

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/kufr-backend.yml
  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    uses: ./.github/workflows/kufr-firmware.yml
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/kufr-web.yml
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/kufr-ios.yml
  ai-eval:
    needs: changes
    if: needs.changes.outputs.ai-eval == 'true'
    uses: ./.github/workflows/kufr-ai-eval.yml

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/kufr-site.yml
    with:
      verify-manufacturing: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number == '' }}
      force-cad: ${{ inputs.force_cad && inputs.pr_number == '' }}

  cad:
    needs: changes
    if: needs.changes.outputs.cad == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/kufr-cad.yml
    with:
      force: ${{ inputs.force_cad && inputs.pr_number == '' }}

  required:
    name: CI required
    if: always()
    needs: [secret-scan, changes, repository, tracking, backend, firmware, web, ios, ai-eval, site, cad]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
      SELECTED_PROJECTS: ${{ toJSON(needs.changes.outputs) }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
      TRACKING_RESULT: ${{ needs.tracking.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require secret scan and selected builds to succeed
        run: |
          if [ "$SECRET_SCAN_RESULT" != success ]; then
            echo 'Secret scan did not succeed' >&2
            exit 1
          fi
          if [ "$TRACKING_RESULT" != success ]; then
            echo 'Project tracking checks did not succeed' >&2
            exit 1
          fi
          python3 scripts/ci/select_projects.py check
