name: Kufr iOS

on:
  push:
    branches: [main]
    paths:
      - kufr/mobilni-aplikace/**
      - .github/workflows/kufr-ios.yml
  pull_request:
    branches: [main]
    paths:
      - kufr/mobilni-aplikace/**
      - .github/workflows/kufr-ios.yml
  workflow_dispatch:
    inputs:
      sign_ipa:
        description: Build a development-signed IPA for the registered iPhone
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: kufr-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kufr/mobilni-aplikace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: kufr/mobilni-aplikace/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: bash -n scripts/build-ios-ipa.sh

  ios-simulator:
    needs: web
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: kufr/mobilni-aplikace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check Xcode
        run: test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: kufr/mobilni-aplikace/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Build unsigned simulator app
        run: >-
          xcodebuild build
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/kufr-ios-derived"
          CODE_SIGNING_ALLOWED=NO
      - name: Launch app in iOS Simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$RUNNER_TEMP/kufr-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$device_id" app.turquoise6409.green2444
          xcrun simctl terminate "$device_id" app.turquoise6409.green2444
      - name: Save resolved Swift package versions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kufr-swift-package-resolved
          path: kufr/mobilni-aplikace/ios/App/**/Package.resolved
          if-no-files-found: error
          retention-days: 14

  signed-ipa:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_ipa && github.ref == 'refs/heads/main'
    needs: ios-simulator
    runs-on: macos-15
    environment: ios-signing
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: kufr/mobilni-aplikace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: kufr/mobilni-aplikace/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build signed IPA
        env:
          IOS_BUNDLE_ID: app.turquoise6409.green2444
          IOS_TEAM_ID: 3QRXV8G5Y3
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: bash scripts/build-ios-ipa.sh
      - name: Save signed IPA and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kufr-ios-development-ipa
          path: kufr/mobilni-aplikace/dist/ipa/*
          if-no-files-found: error
          retention-days: 14
