name: Build Kufr iOS

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kufr/mobilni-aplikace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: |
            kufr/mobilni-aplikace/package-lock.json
            kufr/contracts/package-lock.json
            kufr/simulator/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../contracts
      - run: npm test --prefix ../contracts
      - run: npm test
      - run: npm run build
      - run: bash -n scripts/build-ios-ipa.sh
      - run: python3 -m unittest discover -s scripts -p 'test_publish_*.py'
      - name: Package web build with provenance
        working-directory: .
        run: python3 scripts/ci/package.py pack kufr/mobilni-aplikace/dist "$RUNNER_TEMP/web-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-package/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  ios-simulator:
    needs: web
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: kufr/mobilni-aplikace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check Xcode
        run: test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: kufr/mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: |
            kufr/mobilni-aplikace/package-lock.json
            kufr/contracts/package-lock.json
            kufr/simulator/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../contracts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-package
      - name: Reuse tested web build
        working-directory: .
        run: python3 scripts/ci/package.py unpack "$RUNNER_TEMP/web-package" kufr/mobilni-aplikace/dist
      - run: npx cap sync ios
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Test native pinned LAN transport
        run: |
          npm ci --prefix ../simulator
          bash scripts/test-native-transport.sh
      - name: Test native debug backend client
        run: bash scripts/test-native-debug.sh
      - name: Build unsigned simulator app
        run: >-
          xcodebuild build
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/kufr-ios-derived"
          CODE_SIGNING_ALLOWED=NO
      - name: Launch app in iOS Simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$RUNNER_TEMP/kufr-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$device_id" app.turquoise6409.green2444
          xcrun simctl terminate "$device_id" app.turquoise6409.green2444
      - name: Save resolved Swift package versions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kufr-swift-package-resolved
          path: kufr/mobilni-aplikace/ios/App/**/Package.resolved
          if-no-files-found: error
          retention-days: 14
          overwrite: true
