name: Check Kufr iOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      NPM_CONFIG_FETCH_TIMEOUT: '30000'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: mobilni-aplikace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Xcode
        run: test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"
      - name: Test signing guards and cleanup without credentials
        run: |
          python3 -m unittest discover -s scripts -p 'test_configure_ios_signing.py'
          python3 -m unittest discover -s scripts -p 'test_validate_ios_profile.py'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobilni-aplikace/package-lock.json
            contracts/package-lock.json
            firmware/simulator/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../contracts
      - run: npm ci --prefix ../firmware/simulator
      - run: npm run build
      - run: npx cap sync ios
      - name: Generate original native assets
        run: node scripts/generate-native-assets.mjs
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Test native pinned LAN transport
        run: bash scripts/test-native-transport.sh
      - name: Test native debug backend client and voice sessions
        run: bash scripts/test-native-debug.sh
      - name: Test secure BLE status and secret whitelist
        run: bash scripts/test-native-provisioning.sh
      - name: Test native identity origin policy and authentication bridge
        run: bash scripts/test-native-identity.sh
      - name: Build unsigned iOS Simulator app
        env:
          CAPTURE_STORE_PREVIEW: ${{ github.workflow == 'Check Kufr iOS' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          KUFR_PASSKEY_RP_DOMAIN: ${{ vars.KUFR_PASSKEY_RP_DOMAIN }}
        run: |
          preview_settings=()
          if [[ "$CAPTURE_STORE_PREVIEW" == true ]]; then
            python3 - <<'PY'
          import os, re
          domain = os.environ.get('KUFR_PASSKEY_RP_DOMAIN', '')
          if not re.fullmatch(r'(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?', domain):
              raise SystemExit('Store preview requires the canonical KUFR_PASSKEY_RP_DOMAIN repository variable.')
          PY
            preview_settings+=("KUFR_ACCOUNT_ORIGIN=https://$KUFR_PASSKEY_RP_DOMAIN" "KUFR_PASSKEY_RP_DOMAIN=$KUFR_PASSKEY_RP_DOMAIN")
          fi
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            "${preview_settings[@]}" CODE_SIGNING_ALLOWED=NO build
      - name: Capture native App Store preview candidates
        id: store-preview
        if: github.workflow == 'Check Kufr iOS' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        timeout-minutes: 20
        env:
          IOS_STORE_PREVIEW_CONFIGURATION: Debug
        run: bash scripts/capture-ios-store-preview.sh "$RUNNER_TEMP/ios-derived-data/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/ios-store-preview"
      - name: Export native App Store preview candidates
        if: success() && steps.store-preview.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-store-preview-${{ github.sha }}
          path: ${{ runner.temp }}/ios-store-preview/
          if-no-files-found: error
          retention-days: 7
