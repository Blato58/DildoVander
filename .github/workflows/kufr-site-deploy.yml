name: Deploy Arcane Workshop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dildovander-site-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'Blato58/DildoVander' && github.event.repository.private == true && (github.ref == 'refs/heads/main')
    uses: ./.github/workflows/kufr-site.yml
    with:
      publish: true
