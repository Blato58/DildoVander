name: Deploy Arcane Workshop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kufr-site*.yml'
      - 'kufr/web/**'
      - 'kufr/mechanika/**'
      - 'kufr/design-system/**'
      - 'kufr/mobilni-aplikace/**'
      - 'kufr/contracts/**'
      - 'kufr/simulator/dashboard*'
      - 'scripts/ci/package.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dildovander-site-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/kufr-site.yml
    with:
      publish: true
