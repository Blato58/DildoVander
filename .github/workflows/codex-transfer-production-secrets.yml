name: One-time backend environment sealedbox transfer

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: one-time-backend-secret-transfer
  cancel-in-progress: false

jobs:
  seal:
    if: github.repository == 'Blato58/DildoVander' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.repository.private == true
    runs-on: [self-hosted, kufr-backend]
    environment: backend-production
    timeout-minutes: 5
    steps:
      - name: Reseal existing environment secrets for the private destination
        shell: bash
        env:
          DESTINATION_PUBLIC_KEY: 'Q8YuDVu04cPpGgJmP8uU3eC9KArzFrI4AHEU7+xpAg4='
          DESTINATION_KEY_ID: '3380204578043523366'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEVICE_ID: ${{ secrets.DEVICE_ID }}
          DEVICE_CREDENTIAL_SHA256: ${{ secrets.DEVICE_CREDENTIAL_SHA256 }}
          ADMIN_CREDENTIAL: ${{ secrets.ADMIN_CREDENTIAL }}
          DEV_DEVICE_CREDENTIAL: ${{ secrets.DEV_DEVICE_CREDENTIAL }}
          LOG_READER_CREDENTIAL: ${{ secrets.LOG_READER_CREDENTIAL }}
        run: |
          set +x
          ulimit -c 0
          python3 - <<'PY'
          """One-time GitHub environment secret resealing; Python standard library only."""

          import base64
          import ctypes
          import json
          import os
          import stat
          import sys


          REQUIRED_SECRETS = (
              "OPENAI_API_KEY",
              "DEVICE_ID",
              "DEVICE_CREDENTIAL_SHA256",
              "ADMIN_CREDENTIAL",
              "DEV_DEVICE_CREDENTIAL",
          )
          OPTIONAL_SECRETS = ("LOG_READER_CREDENTIAL",)


          class SealedBox:
              def __init__(self):
                  self.library = ctypes.CDLL("libsodium.so.23")
                  self.library.sodium_init.argtypes = []
                  self.library.sodium_init.restype = ctypes.c_int
                  self.library.sodium_memzero.argtypes = [ctypes.c_void_p, ctypes.c_size_t]
                  self.library.sodium_memzero.restype = None
                  for name in ("crypto_box_publickeybytes", "crypto_box_secretkeybytes", "crypto_box_sealbytes"):
                      function = getattr(self.library, name)
                      function.argtypes = []
                      function.restype = ctypes.c_size_t
                  self.library.crypto_box_seal.argtypes = [
                      ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p
                  ]
                  self.library.crypto_box_seal.restype = ctypes.c_int
                  if self.library.sodium_init() < 0:
                      raise RuntimeError("Sodium initialization failed")
                  if (self.library.crypto_box_publickeybytes(),
                      self.library.crypto_box_secretkeybytes(),
                      self.library.crypto_box_sealbytes()) != (32, 32, 48):
                      raise RuntimeError("Unexpected sodium ABI")

              def seal(self, plaintext, public_key):
                  if len(public_key) != 32 or not isinstance(plaintext, bytearray):
                      raise ValueError("Invalid seal input")
                  # The mutable plaintext buffer is wiped even if encryption fails.
                  message = (ctypes.c_ubyte * len(plaintext)).from_buffer(plaintext)
                  key = (ctypes.c_ubyte * 32).from_buffer_copy(public_key)
                  encrypted = (ctypes.c_ubyte * (len(plaintext) + 48))()
                  try:
                      if self.library.crypto_box_seal(encrypted, message, len(plaintext), key) != 0:
                          raise RuntimeError("Sealing failed")
                      return base64.b64encode(encrypted).decode("ascii")
                  finally:
                      self.library.sodium_memzero(message, len(plaintext))


          def create_payload(sealed_box, destination_key, secret_environment):
              public_key = base64.b64decode(destination_key["key"], validate=True)
              key_id = destination_key["key_id"]
              if len(public_key) != 32 or not isinstance(key_id, str) or not key_id.isdecimal():
                  raise ValueError("Invalid destination public key metadata")
              if any(not secret_environment.get(name) for name in REQUIRED_SECRETS):
                  raise ValueError("Missing required source secret")
              encrypted_secrets = []
              for name in REQUIRED_SECRETS + OPTIONAL_SECRETS:
                  value = secret_environment.pop(name, "")
                  if not value:
                      continue
                  plaintext = bytearray(value, "utf-8")
                  del value
                  encrypted_secrets.append({
                      "name": name,
                      "encrypted_value": sealed_box.seal(plaintext, public_key),
                      "key_id": key_id,
                  })
              return {
                  "schema_version": 1,
                  "source_repository": "Blato58/DildoVander",
                  "destination_repository": "Blato58/DildoVander-deploy",
                  "destination_environment": "backend-production",
                  "key_id": key_id,
                  "secrets": encrypted_secrets,
              }


          def transfer():
              destination_key = {
                  "key": os.environ.pop("DESTINATION_PUBLIC_KEY"),
                  "key_id": os.environ.pop("DESTINATION_KEY_ID"),
              }
              payload = create_payload(SealedBox(), destination_key, os.environ)
              run_id = os.environ["GITHUB_RUN_ID"]
              run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
              for identifier in (run_id, run_attempt):
                  if not identifier.isascii() or not identifier.isdecimal() or len(identifier) > 20:
                      raise ValueError("Invalid workflow run identifier")
              base_descriptor = os.open(
                  "/var/tmp/kufr-secret-transfer", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
              )
              run_descriptor = None
              run_directory = run_id + "-" + run_attempt
              created_run_directory = False
              created_output = False
              try:
                  base_metadata = os.fstat(base_descriptor)
                  if base_metadata.st_uid != os.getuid() or stat.S_IMODE(base_metadata.st_mode) != 0o700:
                      raise ValueError("Unprotected ciphertext base directory")
                  # Directory creation is exclusive; an earlier run or symlink cannot be reused.
                  os.mkdir(run_directory, mode=0o700, dir_fd=base_descriptor)
                  created_run_directory = True
                  run_descriptor = os.open(
                      run_directory, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                      dir_fd=base_descriptor,
                  )
                  run_metadata = os.fstat(run_descriptor)
                  if run_metadata.st_uid != os.getuid() or stat.S_IMODE(run_metadata.st_mode) != 0o700:
                      raise ValueError("Unprotected ciphertext run directory")
                  descriptor = os.open(
                      "sealed.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                      0o600, dir_fd=run_descriptor,
                  )
                  created_output = True
                  with os.fdopen(descriptor, "w", encoding="ascii") as output:
                      os.fchmod(output.fileno(), 0o600)
                      json.dump(payload, output, ensure_ascii=True, separators=(",", ":"))
                      output.write("\n")
                      output.flush()
                      os.fsync(output.fileno())
              except BaseException:
                  if run_descriptor is not None and created_output:
                      try:
                          os.unlink("sealed.json", dir_fd=run_descriptor)
                      except FileNotFoundError:
                          pass
                  if created_run_directory:
                      os.rmdir(run_directory, dir_fd=base_descriptor)
                  raise
              finally:
                  if run_descriptor is not None:
                      os.close(run_descriptor)
                  os.close(base_descriptor)


          def self_test():
              # This path only creates synthetic secrets and a fresh local test keypair.
              box = SealedBox()
              library = box.library
              library.crypto_box_keypair.argtypes = [ctypes.c_void_p, ctypes.c_void_p]
              library.crypto_box_keypair.restype = ctypes.c_int
              library.crypto_box_seal_open.argtypes = [
                  ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong,
                  ctypes.c_void_p, ctypes.c_void_p,
              ]
              library.crypto_box_seal_open.restype = ctypes.c_int
              public_key = (ctypes.c_ubyte * 32)()
              private_key = (ctypes.c_ubyte * 32)()
              if library.crypto_box_keypair(public_key, private_key) != 0:
                  raise RuntimeError("Synthetic keypair failed")
              try:
                  key_metadata = {"key_id": "1234", "key": base64.b64encode(public_key).decode("ascii")}
                  samples = (b"synthetic-only", b"line1\nline2\n", "synthetic-\u010d".encode("utf-8"))
                  for sample in samples:
                      plaintext = bytearray(sample)
                      ciphertext = base64.b64decode(box.seal(plaintext, bytes(public_key)), validate=True)
                      if plaintext != bytearray(len(sample)) or len(ciphertext) != len(sample) + 48:
                          raise AssertionError("Synthetic buffer or size mismatch")
                      encrypted = (ctypes.c_ubyte * len(ciphertext)).from_buffer_copy(ciphertext)
                      opened = (ctypes.c_ubyte * len(sample))()
                      if library.crypto_box_seal_open(opened, encrypted, len(ciphertext), public_key, private_key) != 0:
                          raise AssertionError("Synthetic opening failed")
                      if bytes(opened) != sample:
                          raise AssertionError("Synthetic roundtrip mismatch")
                      encrypted[0] ^= 1
                      if library.crypto_box_seal_open(opened, encrypted, len(ciphertext), public_key, private_key) == 0:
                          raise AssertionError("Synthetic tamper accepted")
                      library.sodium_memzero(opened, len(opened))
                  required = {name: "synthetic-only" for name in REQUIRED_SECRETS}
                  payload = create_payload(box, key_metadata, required.copy())
                  if [item["name"] for item in payload["secrets"]] != list(REQUIRED_SECRETS):
                      raise AssertionError("Synthetic required allowlist mismatch")
                  optional = dict(required, LOG_READER_CREDENTIAL="synthetic-optional", UNRELATED="ignored")
                  payload = create_payload(box, key_metadata, optional)
                  if len(payload["secrets"]) != 6 or optional != {"UNRELATED": "ignored"}:
                      raise AssertionError("Synthetic optional allowlist mismatch")
                  missing = required.copy()
                  del missing[REQUIRED_SECRETS[0]]
                  try:
                      create_payload(box, key_metadata, missing)
                  except ValueError:
                      pass
                  else:
                      raise AssertionError("Synthetic missing input accepted")
              finally:
                  library.sodium_memzero(private_key, len(private_key))
              print("Synthetic sealedbox tests passed; no production secret input used.")


          if __name__ == "__main__":
              try:
                  if sys.argv[1:] == ["--self-test"]:
                      self_test()
                  elif len(sys.argv) == 1:
                      transfer()
                  else:
                      raise ValueError("Unsupported arguments")
              except BaseException:
                  # Never include exception details: source secrets may appear in library errors.
                  print("Sealedbox transfer failed; no plaintext details emitted.", file=sys.stderr)
                  sys.exit(1)
          PY
