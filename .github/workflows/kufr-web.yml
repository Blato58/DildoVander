name: Check Kufr mobile web

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobilni-aplikace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobilni-aplikace/package-lock.json
            contracts/package-lock.json
            firmware/simulator/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../contracts
      - run: npm test --prefix ../contracts
      - run: npm test
      - run: npm run build
      - run: bash -n scripts/build-ios-ipa.sh
      - run: python3 -m unittest discover -s scripts -p 'test_publish_*.py'
      - name: Test app-only iOS signing settings and source restoration
        run: python3 -m unittest discover -s scripts -p 'test_configure_ios_signing.py'
      - name: Package web build with provenance
        working-directory: .
        run: python3 scripts/ci/package.py pack mobilni-aplikace/dist "$RUNNER_TEMP/web-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # PR CI validates packages; explicit main builds retain deployable artifacts.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !github.event.inputs.pr_number
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-package/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
