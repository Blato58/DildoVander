name: Kufr AI development eval

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate synthetic corpus and fail-closed parser
        run: python3 -m unittest discover -s ai-eval -p 'test_*.py'
