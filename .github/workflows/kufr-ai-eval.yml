name: Kufr AI development eval

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      party_compare:
        description: Adaptive party conversations using Sol (total cap 1 USD)
        type: boolean
        default: false
      party_models:
        description: Sol dialogue model
        type: choice
        options: [compare, selected]
        default: compare
      party_budget_micro_usd:
        description: Remaining authorized total run budget in millionths of USD (max 1000000)
        type: string
        default: '1000000'
      model:
        description: Dialogue model to compare
        type: choice
        required: true
        default: gpt-6.1-sol
        options:
          - gpt-6.1-sol
      case_id:
        description: Case ID from kufr/ai-eval/cases.json (one per paid run)
        type: string
        required: true
        default: unavailable_request

permissions:
  contents: read

concurrency:
  group: kufr-ai-eval-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate synthetic corpus and fail-closed parser
        run: python3 -m unittest discover -s kufr/ai-eval -p 'test_*.py'

  live:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: backend-production
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SESSION_CAP_MICRO_USD: ${{ secrets.SESSION_CAP_MICRO_USD }}
      MODEL: ${{ inputs.model }}
      CASE_ID: ${{ inputs.case_id }}
      PARTY_MODELS: ${{ inputs.party_models }}
      PARTY_BUDGET: ${{ inputs.party_budget_micro_usd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned OpenAI SDK
        run: python3 -m pip install -r kufr/ai-eval/requirements.txt
      - name: Evaluate one synthetic turn
        if: ${{ !inputs.party_compare }}
        run: python3 kufr/ai-eval/evaluate.py --model "$MODEL" --case "$CASE_ID" --output "$RUNNER_TEMP/evaluation.json"
      - name: Compare adaptive synthetic party dialogues
        if: ${{ inputs.party_compare }}
        run: |
          if [ "$PARTY_MODELS" = selected ]; then
            python3 kufr/ai-eval/evaluate_party.py --models "$MODEL" --budget-micro-usd "$PARTY_BUDGET" --output "$RUNNER_TEMP/evaluation.json"
          else
            python3 kufr/ai-eval/evaluate_party.py --budget-micro-usd "$PARTY_BUDGET" --output "$RUNNER_TEMP/evaluation.json"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kufr-ai-evaluation
          path: ${{ runner.temp }}/evaluation.json
          if-no-files-found: warn
          retention-days: 7
