name: Kufr GPT-Live provider diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kufr-gpt-live-smoke
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, kufr-backend]
    environment: backend-production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: kufr/global.json
      - name: Test greeting with continuous synthetic silence (35 seconds maximum)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: dotnet run --project kufr/backend-tests/BackendTests.csproj -c Release -- --gpt-live-smoke
