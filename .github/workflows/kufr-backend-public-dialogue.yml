name: Kufr backend public dialogue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kufr-backend-production
  cancel-in-progress: false

jobs:
  dialogue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: backend-production
    env:
      DEV_DEVICE_CREDENTIAL: ${{ secrets.DEV_DEVICE_CREDENTIAL }}
      DEVICE_ID: ${{ secrets.DEVICE_ID }}
      DIALOG_EXPECTATION: responses
      SMOKE_TRANSPORT: public
      PUBLIC_IPV4: ${{ vars.KUFR_BACKEND_PUBLIC_IPV4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise AI opening over public HTTPS
        run: python3 kufr/backend/tests/deployed_smoke.py
