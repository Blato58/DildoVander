name: Resolve Kufr Swift packages once

on:
  workflow_dispatch:
  push:
    branches: [codex/event-software-completion]
    paths:
      - .github/workflows/kufr-swift-resolve.yml
      - kufr/mobilni-aplikace/ios/App/App.xcodeproj/project.pbxproj

permissions:
  contents: read

jobs:
  resolve:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout and Xcode
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"
      - name: Resolve existing native project
        working-directory: kufr/mobilni-aplikace
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Verify generated resolution includes BLE dependencies
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("kufr/mobilni-aplikace/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved")
          lock = json.loads(path.read_text())
          pins = {pin["identity"]: pin for pin in lock["pins"]}
          for identity in ("capacitor-swift-pm", "esp-idf-provisioning-ios", "swift-protobuf"):
              assert identity in pins, f"Missing resolved dependency: {identity}"
              assert len(pins[identity]["state"]["revision"]) == 40, f"Missing revision: {identity}"
          assert pins["capacitor-swift-pm"]["state"]["version"] == "8.5.2"
          assert pins["esp-idf-provisioning-ios"]["state"]["version"] == "3.2.0"
          print("Actual Xcode package resolution includes Capacitor, ESPProvision and SwiftProtobuf.")
          PY
      - name: Upload actual resolver output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kufr-swift-package-resolution
          path: kufr/mobilni-aplikace/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
          retention-days: 3
