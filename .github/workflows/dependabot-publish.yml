name: Commit Dependabot dependency artifacts

on:
  workflow_run:
    workflows: [Generate Dependabot dependency artifacts]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-publish-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Duloc-Dungeon/DildoVander' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      # Only default-branch code executes with this token. Artifacts are data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: plan
        with:
          script: |
            const sync = require('./scripts/ci/dependabot-sync.cjs');
            const plan = await sync.producerPlan({ github, context, core });
            if (!plan) return;
            core.setOutput('plan', JSON.stringify(plan));
            for (const key of ['backend', 'native']) core.setOutput(key, plan[key]);
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.plan.outputs.backend == 'true'
        with:
          name: dependabot-backend
          path: ${{ runner.temp }}/dependabot/backend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.plan.outputs.native == 'true'
        with:
          name: dependabot-native
          path: ${{ runner.temp }}/dependabot/native
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate, commit allowed outputs and dispatch current CI
        if: steps.plan.outputs.plan != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPENDABOT_PLAN: ${{ steps.plan.outputs.plan }}
          DEPENDABOT_ARTIFACTS: ${{ runner.temp }}/dependabot
        with:
          script: |
            await require('./scripts/ci/dependabot-sync.cjs').publish(
              { github, context, core }, JSON.parse(process.env.DEPENDABOT_PLAN), process.env.DEPENDABOT_ARTIFACTS);
