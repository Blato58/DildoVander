[platformio]
default_envs = production

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 16MB

[env:production]
build_src_filter =
    +<production/>
board_build.partitions = partitions_16mb.csv
board_upload.maximum_size = 6553600

[env:diag-board-memory]
build_src_filter =
    +<diagnostics/board-memory/>
upload_speed = 460800

[env:diag-hardware-service]
build_src_filter =
    +<diagnostics/hardware-service/>
board_build.partitions = partitions_16mb.csv

[env:diag-network-service]
build_src_filter =
    +<diagnostics/network-service/>
board_build.partitions = partitions_16mb.csv

[env:diag-pca9685-logic]
build_src_filter =
    +<diagnostics/pca9685-logic/>
upload_speed = 460800

[env:diag-servo-bench]
build_src_filter =
    +<diagnostics/servo-bench/>
monitor_echo = yes
upload_speed = 460800
