title = "DildoVander secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Reviewed synthetic export idempotency UUID declarations"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^mobilni-aplikace/src/features/customer/customerDataExport\.spec\.ts$''']
regexTarget = "line"
regexes = [
  '''^\s*const keyOne = '6d8c7912-48c7-499c-a61a-138d0ca7932d';\s*$''',
  '''^\s*const keyTwo = 'b8b228c8-b9d5-43d4-ac5a-8c0c85607d0e';\s*$''',
]

# Keep every upstream detector. Only generic-api-key misreads these non-secrets.
# AND binds each content exception to its intended file; no whole-file exclusions.
# Source exceptions retain the former kufr/ prefix for full-history scanning.
[[allowlists]]
# Retired paths are retained only for the full-history scan, including commits
# before the private migration. They do not refer to current tracking inputs.
description = "Historical SHA-256 file inventories in archived evidence"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^docs/project/(evidence|artifacts)/[^/]+\.json$''',
  '''^docs/project/artifacts/KUFR-TWIN-MIC-QUEUE-deploy-v1/twin-release\.json$''',
]
regexTarget = "line"
regexes = ['''^\s*"[^"\r\n]+\.(py|cs|cpp|h|cjs|mjs|js|ts|mts|swift|json|md|dll|pdb|exe|so|dylib)":\s*"[0-9a-f]{64}"\s*,?\s*$''']

[[allowlists]]
description = "CAD component identifier, not an API credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(kufr/)?mechanika/cad/scripts/generate\.py$''']
regexTarget = "line"
regexes = ['''^\s*key = "DFR0954_amplifier"\s*$''']

[[allowlists]]
description = "Smoke test passes a generated idempotency key by variable"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(kufr/)?backend/tests/deployed_smoke\.py$''']
regexTarget = "line"
regexes = ['''^\s*"POST", "/v1/conversations", bearer=token, key=create_key, body=conversation_body\s*$''']

[[allowlists]]
description = "Reviewed synthetic firmware idempotency UUID"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(kufr/)?firmware/tests/conversation_(text_codec|start_coordinator)_test\.cpp$''']
regexTarget = "line"
regexes = ['''^\s*request\.idempotencyKey = "7731ce10-a53c-4934-8909-06870fc86a12";\s*$''']

[[allowlists]]
description = "RFC 6455 public example nonce in the synthetic WebSocket handshake"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^(kufr/)?mobilni-aplikace/tests/native_handsfree/socket_peer\.test\.mjs$''',
  '''^(kufr/)?firmware/tests/espidf_device_media_socket_test\.cpp$''',
]
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[allowlists]]
description = "Synthetic host-only ESP-IDF socket test token"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(kufr/)?firmware/tests/espidf_device_media_socket_test\.cpp$''']
regexTarget = "secret"
regexes = ['''^c3ludGhldGljLXRlc3QtdG9rZW4=$''']

[[allowlists]]
description = "The scanner regression embeds the three reviewed non-secret values"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^scripts/ci/test_secret_scan\.py$''']
regexTarget = "secret"
regexes = ['''^DFR0954_amplifier$''', '''^body=conversation_body$''', '''^7731ce10-a53c-4934-8909-06870fc86a12$''']

[[allowlists]]
description = "Reviewed historical TypeScript guest HTTP header allowlist"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["e5dc9e3df11c7ece97de70afa924357b00d86176"]
paths = ['''^kufr/mobilni-aplikace/src/features/archive/nativeGuest\.ts$''']
regexTarget = "line"
regexes = ['''^\s*if \(!\['accept', 'content-type', 'x-dv10-csrf', 'idempotency-key', 'x-dv10-consent'\]\.includes\(name\)\) throw new GuestError\(400\);\s*$''']

[[allowlists]]
description = "Reviewed historical Swift guest HTTP header allowlist"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["e5dc9e3df11c7ece97de70afa924357b00d86176"]
paths = ['''^kufr/mobilni-aplikace/ios/App/App/KufrIdentityPlugin\.swift$''']
regexTarget = "line"
regexes = ['''^\s*let permitted = \["accept", "content-type", "x-dv10-csrf", "idempotency-key", "x-dv10-consent"\]\s*$''']

[[allowlists]]
description = "Reviewed Vue migration TypeScript guest HTTP header declaration"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["d96ff01ac21f4d0a088739a93e811189cdaa5e3e"]
paths = ['''^kufr/mobilni-aplikace/src/features/archive/nativeGuest\.ts$''']
regexTarget = "line"
regexes = ['''^\s*'idempotency-key',\r?\n\s*'x-dv10-consent',\s*$''']

[[allowlists]]
description = "Reviewed Vue migration Swift guest HTTP header declaration"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["d96ff01ac21f4d0a088739a93e811189cdaa5e3e"]
paths = ['''^kufr/mobilni-aplikace/ios/App/App/AccountTransportPolicy\.swift$''']
regexTarget = "line"
regexes = ['''^\s*return \["accept", "content-type", "x-dv10-csrf", "idempotency-key", "x-dv10-consent"\]\.contains\(key\)\s*$''']
