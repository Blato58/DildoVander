# Protected data stays on the existing TLS origin; public site is unchanged.
location = /twin {
    proxy_pass http://127.0.0.1:5082;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_read_timeout 30s;
}
location ^~ /v1/twin/ {
    proxy_pass http://127.0.0.1:5082;
    proxy_set_header Host $host;
    # Metadata-free browser JPEG is capped at262144 bytes; Kestrel keeps its
    #4096-byte default and each other Twin route enforces its smaller bound.
    client_max_body_size 256k;
    add_header Cache-Control "no-store" always;
    proxy_read_timeout 30s;
}
