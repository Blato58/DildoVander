# Generic analytical/slicer audit profile, not a machine-ready printer preset.
# Geometry acceptance additionally requires a measured unsupported gap <=12 mm.
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_type = PETG
layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 5
fill_density = 40%
fill_pattern = gyroid
support_material = 0
support_material_auto = 0
support_material_enforce_layers = 0
raft_layers = 0
brim_width = 0
skirts = 0
bridge_speed = 20
bridge_angle = 0
bridge_fan_speed = 100
cooling = 1
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 100
disable_fan_first_layers = 2
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
gcode_flavor = reprap
use_relative_e_distances = 0
use_volumetric_e = 0
binary_gcode = 0
arc_fitting = disabled
autoemit_temperature_commands = 0
start_gcode =
end_gcode =
before_layer_gcode =
layer_gcode =
between_objects_gcode =
toolchange_gcode =
start_filament_gcode =
end_filament_gcode =
output_filename_format = [input_filename_base].gcode
