# Vapour Chrome routes; leave API, iOS and CloudVPSBridge locations intact.
location = / {
    root /var/www/dildovander/current;
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
}
location = /site-manifest.json {
    root /var/www/dildovander/current;
    add_header Cache-Control "no-store" always;
}
location = /site.css {
    root /var/www/dildovander/current;
    add_header Cache-Control "no-store" always;
}
location = /workshop { return 308 /workshop/; }
location ^~ /workshop/ {
    alias /var/www/dildovander/current/workshop/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /companion { return 308 /companion/; }
location ^~ /companion/ {
    alias /var/www/dildovander/current/companion/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /simulator { return 308 /simulator/; }
location ^~ /simulator/ {
    alias /var/www/dildovander/current/simulator/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /design-system/ {
    alias /var/www/dildovander/current/design-system/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
