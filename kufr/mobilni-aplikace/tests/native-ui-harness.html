<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test nativního rozhraní kufru</title>
  </head>
  <body>
    <p style="padding:1rem;background:#593b19">TEST NATIVNÍHO ROZHRANÍ · syntetický bridge, bez sítě a kufru</p>
    <div id="app"></div>
    <script type="module">
      // Served by Vite only; never included in the single index.html release.
      import snapshot from '../../contracts/fixtures/valid/state-snapshot.json';
      let paired = false;
      let saved;
      let listener;
      let connectionId;
      let debugStatus = { configured: false, running: false, session: false, recording: false,
        phase: 'idle', mode: 'unknown', transcript: [], selected: null, timings: null };
      let simulatedMask = 63;
      let askedQuestions = 0;
      const questions = [
        'Jak ti říkají?', 'Co tě v poslední době opravdu bavilo?',
        'Kdy ses naposledy odvážil zkusit něco nového?',
        'Co na tobě tvoji blízcí nejvíc oceňují?',
      ];
      function simulateAnswer(text) {
        if (!debugStatus.session || debugStatus.recording || !text.trim()) {
          throw new Error('No answer expected');
        }
        debugStatus.transcript.push({ role: 'visitor', text });
        if (askedQuestions < questions.length) {
          debugStatus.transcript.push({ role: 'kufr', text: questions[askedQuestions++] });
          debugStatus.phase = 'awaiting';
        } else {
          const available = Array.from({ length: 6 }, (_, index) => index + 1)
            .filter(number => simulatedMask & (1 << (number - 1)));
          debugStatus.selected = available[(text.length + askedQuestions) % available.length];
          debugStatus.transcript.push({ role: 'kufr',
            text: `Navrhuji hůlku z přihrádky ${debugStatus.selected}.` });
          debugStatus.session = false;
          debugStatus.phase = 'completed';
        }
        debugStatus.timings = { dialogMs: 45, speechMs: 80, downloadMs: 12, totalMs: 137 };
      }
      let serverState = { revision: 'test-revision', dialogMode: 'fake', voiceMode: 'fake',
        dialogAvailable: true, voiceAvailable: true, activeConversations: 0, lifetime: 'until_restart' };
      const originalEveningId = '00000000-0000-4000-8000-000000000001';
      let eveningState = { activeEveningId: originalEveningId, evenings: [{
        eveningId: originalEveningId, name: 'Původní večer', createdAt: '2026-10-01T18:00:00Z',
        exchangeCount: 42, droppedCount: 0,
      }] };
      window.CapacitorCustomPlatform = { name: 'ios' };
      window.Capacitor = {
        PluginHeaders: [{ name: 'KufrDeviceTransport', methods: [
          ...['savedDevice', 'discover', 'setAddress', 'pair', 'connect', 'send', 'close', 'forget', 'removeListener'].map((name) => ({ name, rtype: 'promise' })),
          { name: 'addListener', rtype: 'callback' },
        ] }, { name: 'KufrDebug', methods: ['status', 'configure', 'inspectBackend', 'inspectServer', 'changeServerModes',
          'runOpeningSpeech', 'startConversation', 'answerConversation', 'startRecording', 'finishRecording',
          'speakSystem', 'stop', 'shareLog', 'forgetProfile', 'inspectEvenings', 'createEvening',
          'activateEvening'].map((name) => ({ name, rtype: 'promise' })) }],
        nativeCallback(_plugin, method, _options, callback) {
          if (method === 'addListener') { listener = callback; return Promise.resolve('listener-1'); }
        },
        async nativePromise(_plugin, method, options) {
          if (_plugin === 'KufrDebug') {
            if (method === 'status') { return { ...debugStatus }; }
            if (method === 'configure') { debugStatus.configured = true; debugStatus.mode = 'unknown'; return; }
            if (method === 'forgetProfile') {
              debugStatus.configured = false; debugStatus.mode = 'unknown'; debugStatus.evenings = null;
              debugStatus.server = null; debugStatus.transcript = []; debugStatus.selected = null;
              debugStatus.timings = null; return;
            }
            if (['inspectEvenings', 'createEvening', 'activateEvening'].includes(method)) {
              if (!debugStatus.configured || debugStatus.session || debugStatus.running) { throw new Error('Busy'); }
              if (method !== 'inspectEvenings') {
                if (options.expectedEveningId !== eveningState.activeEveningId ||
                    new URLSearchParams(location.search).has('eveningConflict')) {
                  debugStatus.evenings = null; throw new Error('Synthetic evening conflict');
                }
                if (method === 'createEvening') {
                  const eveningId = crypto.randomUUID();
                  eveningState.evenings.push({ eveningId, name: options.name, createdAt: new Date().toISOString(),
                    exchangeCount: 0, droppedCount: 0 });
                  eveningState.activeEveningId = eveningId;
                } else {
                  if (!eveningState.evenings.some(item => item.eveningId === options.eveningId)) { throw new Error('Not found'); }
                  eveningState.activeEveningId = options.eveningId;
                }
                debugStatus.transcript = []; debugStatus.selected = null; debugStatus.timings = null;
              }
              debugStatus.evenings = structuredClone(eveningState); return;
            }
            if (method === 'inspectBackend') { debugStatus.mode = 'fake'; return; }
            if (method === 'inspectServer') { debugStatus.server = { ...serverState }; debugStatus.mode = serverState.voiceMode; return; }
            if (method === 'changeServerModes') {
              if (new URLSearchParams(location.search).has('serverConflict')) { debugStatus.server = null; throw new Error('synthetic conflict'); }
              serverState = { ...serverState, revision: serverState.revision + '-next', dialogMode: options.dialogMode, voiceMode: options.voiceMode };
              debugStatus.server = { ...serverState }; debugStatus.mode = serverState.voiceMode; return;
            }
            if (method === 'speakSystem' || method === 'runOpeningSpeech') {
              debugStatus.running = true; debugStatus.phase = 'playing';
              setTimeout(() => { if (debugStatus.phase === 'playing') { debugStatus.running = false; debugStatus.phase = 'completed'; } }, 1500);
              return;
            }
            if (method === 'startConversation') {
              if (debugStatus.session) { throw new Error('Session active'); }
              simulatedMask = options.readyMask;
              askedQuestions = simulatedMask ? 1 : 0;
              debugStatus.session = simulatedMask !== 0;
              debugStatus.recording = false;
              debugStatus.selected = null;
              debugStatus.transcript = [{ role: 'kufr', text: simulatedMask
                ? questions[0] : 'Dnes nemám připravenou žádnou hůlku.' }];
              debugStatus.timings = { dialogMs: 40, speechMs: 80, downloadMs: 10, totalMs: 130 };
              debugStatus.phase = simulatedMask ? 'awaiting' : 'completed';
              return;
            }
            if (method === 'answerConversation') { simulateAnswer(options.text); return; }
            if (method === 'startRecording') {
              if (!debugStatus.session || debugStatus.phase !== 'awaiting') { throw new Error('No recording turn'); }
              debugStatus.recording = true; debugStatus.phase = 'recording'; return;
            }
            if (method === 'finishRecording') {
              if (!debugStatus.recording) { throw new Error('No recording'); }
              debugStatus.recording = false; debugStatus.phase = 'awaiting';
              simulateAnswer('Moje odpověď nahraná mikrofonem'); return;
            }
            if (method === 'stop') {
              debugStatus.running = false; debugStatus.session = false; debugStatus.recording = false;
              debugStatus.transcript = []; debugStatus.selected = null; debugStatus.timings = null;
              debugStatus.phase = 'cancelled'; return;
            }
            if (method === 'shareLog') { return; }
          }
          if (method === 'removeListener') { listener = null; return; }
          if (method === 'savedDevice') { return paired ? { paired, ...saved } : { paired }; }
          if (method === 'discover') {
            const scenario = new URLSearchParams(location.search).get('discovery');
            return { failed: scenario === 'denied', devices: scenario ? [] : [
              { deviceId: saved?.deviceId ?? 'test-kufr', host: 'kufr-test.local', capabilities: ['manualControl', 'conversationText'] },
            ] };
          }
          if (method === 'setAddress') { saved.host = options.host; return; }
          if (method === 'pair') { paired = true; saved = { deviceId: options.deviceId, host: options.host }; return saved; }
          if (method === 'forget') { paired = false; return; }
          if (method === 'connect') {
            connectionId = options.connectionId;
            setTimeout(() => listener?.({ connectionId, state: 'open' }), 0);
          }
          if (method === 'close') {
            if (options.connectionId === connectionId) { listener?.({ connectionId, state: 'closed' }); }
          }
          if (method === 'send') {
            const message = JSON.parse(options.frame);
            if (message.type === 'hello' || message.type === 'state.get') {
              // No ready physical state is invented by this UI-only harness.
              const state = snapshot ? { ...snapshot, deviceId: saved.deviceId, controlMode: 'recovery', controlLeaseId: null,
                phase: 'recoveryRequired', readyMask: 0, calibrationRevision: 0 } : null;
              if (state) {
                listener?.({ connectionId, state: 'frame', frame: JSON.stringify(message.type === 'hello'
                  ? { protocolVersion: 1, type: 'welcome', requestMessageId: message.messageId, snapshot: state }
                  : state) });
              } else { listener?.({ connectionId, state: 'closed' }); }
            }
          }
        },
      };
      await import('/src/main.ts');
    </script>
  </body>
</html>
