[platformio]
default_envs = esp32-s3-idf

[env]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
monitor_speed = 115200

; Kupovaný modul má 16 MB flash a 8 MB OPI PSRAM.
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
; default_16MB.csv ma dva OTA app sloty po 0x640000, ne jeden 16MB slot.
board_upload.maximum_size = 6553600

[env:esp32-s3-idf]
framework = espidf
board_build.partitions = partitions_16mb.csv

[env:esp32-s3-arduino-serial]
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags = -DBOARD_HAS_PSRAM
build_src_filter = +<*> -<espidf_main.cpp> -<features/backend_access/EspIdfBackendNetwork.cpp> -<features/backend_access/EspIdfNetworkSettings.cpp> -<features/backend_access/EspIdfTokenExchangeTransport.cpp> -<features/backend_access/EspIdfTrustedTimeStore.cpp> -<features/backend_access/EspIdfWifiStation.cpp> -<features/conversation/EspIdfConversationStartTransport.cpp> -<features/conversation/EspIdfConversationTextTransport.cpp> -<features/conversation/EspIdfConversationUuid.cpp> -<features/conversation/EspIdfTurnPollTransport.cpp> -<features/device_control/EspIdfJournalStorage.cpp> -<features/provisioning/EspIdfProvisioningStorage.cpp> -<features/provisioning/EspIdfLocalPairingStorage.cpp> -<features/provisioning/EspIdfSha256.cpp> -<features/provisioning/EspIdfPairingRandom.cpp> -<features/provisioning/EspIdfLocalTlsStorage.cpp> -<features/provisioning/EspIdfLocalTlsValidator.cpp>
