<!doctype html>
<html lang="cs" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2430" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="DildoVander: večer, kufr, dílna a příběhy hůlek v jedné aplikaci." />
    <meta property="og:title" content="DildoVander" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Večer, kufr, dílna a příběhy hůlek v jedné aplikaci." />
    <title>DildoVander</title>
    <script>
      // Claims are capabilities. Remove fragments before imports, routing or requests.
      const duelEntry = () => ['/keepsake/duel.html', '/archive/duel'].includes(location.pathname.replace(/\/$/, ''));
      const captureDuel = () => {
        if (!duelEntry()) return;
        if (location.hash) {
          delete window.__dildovanderDuelGrant;
          const match = location.hash.match(/^#grant=([A-Za-z0-9_-]{43})&side=(left|right)$/);
          const reversed = location.hash.match(/^#side=(left|right)&grant=([A-Za-z0-9_-]{43})$/);
          if (match) window.__dildovanderDuelGrant = { token: match[1], side: match[2] };
          else if (reversed) window.__dildovanderDuelGrant = { token: reversed[2], side: reversed[1] };
          history.replaceState(null, '', location.pathname + location.search);
        }
      };
      captureDuel();
      window.addEventListener('hashchange', captureDuel);
      window.addEventListener('pagehide', () => { delete window.__dildovanderDuelGrant; });
      if (duelEntry() || location.pathname.startsWith('/keepsake')) {
        if (!duelEntry()) window.__dildovanderGuestClaim = location.hash.slice(1);
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
        const robots = document.createElement('meta');
        robots.name = 'robots'; robots.content = 'noindex, nofollow, noarchive';
        document.head.append(robots);
      }
      if (location.pathname === '/signin' || location.pathname === '/signin/') {
        const match = location.hash.match(/^#(invite|recovery)=([A-Za-z0-9_-]{32,256})$/);
        if (match) window.__dildovanderEnrollment = { kind: match[1], token: match[2] };
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      }
    </script>
  </head>
  <body class="aw-root">
    <noscript><h1>DildoVander</h1><p>Samostatný kouzelnický kufr, jeho dílna a příběhy hůlek z večera.</p><p>Pro ovládání, prohlížení modelu a soukromé památky povolte JavaScript. Údaje ani přístupové kódy tato stránka bez vašeho kroku neodesílá.</p></noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
